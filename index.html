    <div class="scale" aria-hidden="true"><span></span><div><span>0%</span><span>50%</span><span>100%</span></div></div>` : `<p class="muted">Appears once applications are submitted.</p>`;
  const plist = (list) => list.map((x) => `<div class="practice"><a href="#compare-${x.q.question_id}" title="Compare productions that did and didn't">${esc(qTitle(x.q))}</a><span class="mono">${x.v}%</span><div class="track"><i class="wrap" style="width:${x.v}%"></i></div></div>`).join("");

  $app.innerHTML = `
    <div class="page-head">
      <div><p class="eyebrow">PEACH v2.0 · ${new Date().toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })}</p><h1>Program dashboard</h1></div>
      <div class="export"><button id="expApps">Export applications</button><button id="expAns">Export answers</button></div>
    </div>
    <div class="panel kpis">
      <div class="kpi"><span class="label">Applications</span><strong>${live.length}</strong><small>${count("draft")} more in draft</small></div>
      <div class="kpi"><span class="label">Awaiting review</span><strong>${waiting}</strong><small>${unassigned ? `${unassigned} not yet assigned` : "All assigned"}</small></div>
      <div class="kpi"><span class="label">Approval rate</span><strong>${pct(count("approved"), decided.length) ?? "–"}${decided.length ? "%" : ""}</strong><small>${count("approved")} approved of ${decided.length} decided</small></div>
      <div class="kpi"><span class="label">Avg. PEACH score</span><strong>${avgWrap ?? "–"}${avgWrap != null ? "%" : ""}</strong><small>${avgApproved != null ? `At wrap · approved productions average ${avgApproved}%` : "At wrap, self-assessed"}</small></div>
    </div>
    <section class="panel block">
      <div class="block-head"><h2>Pipeline</h2><span class="muted">${apps.length} applications</span></div>
      <div class="block-body">
        <div class="pipe" role="img" aria-label="${order.map((s) => `${STATUS[s]} ${count(s)}`).join(", ")}">${order.map((s) => count(s) ? `<span class="c-${s}" style="width:${(count(s) / total) * 100}%" title="${STATUS[s]}: ${count(s)}"></span>` : "").join("")}</div>
        <div class="legend">${order.map((s) => `<span><i class="c-${s}"></i>${STATUS[s]} <b class="mono">${count(s)}</b></span>`).join("")}</div>
      </div>
    </section>
    <section class="panel block">
      <div class="block-head"><h2>Impact categories</h2><span class="muted">Share of available points earned, all submitted applications</span></div>
      <div class="block-body">${bars(catRows)}</div>
    </section>
    <div class="dash-grid">
      <section class="panel block">
        <div class="block-head"><h2>By department</h2><span class="muted">Share of available points earned</span></div>
        <div class="block-body">${bars(deptRows)}</div>
      </section>
      <section class="panel block">
        <div class="block-head"><h2>Practices at wrap</h2><span class="muted">Share of productions doing each</span></div>
        <div class="block-body">${practices.length ? `<p class="label plabel">Most adopted</p>${plist(practices.slice(0, 6))}<p class="label plabel">Least adopted</p>${plist(practices.slice(-6).reverse())}` : `<p class="muted">No wrap answers yet.</p>`}</div>
      </section>
    </div>
    <section class="panel block" style="margin-top:22px">
      <div class="block-head"><h2>By production type</h2><span class="muted">Submitted applications</span></div>
      <div class="table-scroll"><table><thead><tr><th>Type</th><th class="num">Applications</th><th class="num">Approved</th><th class="num">Avg. PEACH score at wrap</th></tr></thead>
      <tbody>${types.map((t) => `<tr><td>${esc(t.t)}</td><td class="num">${t.n}</td><td class="num">${t.approved}</td><td class="num">${t.wrap == null ? '<span class="muted">–</span>' : t.wrap + "%"}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No submitted applications yet.</td></tr>`}</tbody></table></div>
    </section>`;
  document.getElementById("expApps").addEventListener("click", exportApps);
  document.getElementById("expAns").addEventListener("click", exportAnswers);
}

// ── Compare: compliant vs. non-compliant productions ───────────────────────
// "Practice score" = share of available points on Yes answers, computed from
// answers so it works for unscored applications too. Comparing on a single
// practice leaves that practice's own points out so it isn't circular.
// Emissions are compared per shoot day, so a 4-day commercial and a 70-day
// series can sit in the same group. Filters narrow which productions are
// compared; the department filter narrows which practices count.
S.cmp = { mode: "compliance", threshold: 75, stage: "wrap", q: null, metric: "co2" };
const emptyCmpFilters = () => ({ sel: { type: [], sub: [], studio: [], loc: [], status: [], rev: [] }, from: "", to: "", dmin: "", dmax: "", depts: [], footprintOnly: false });
S.cmpF = emptyCmpFilters();
S.cmpFiltersOpen = true;
const regionOf = (loc) => { const parts = (loc || "").split(",").map((x) => x.trim()).filter(Boolean); return parts.length > 1 ? parts[parts.length - 1] : parts[0] || "Not set"; };
const CMP_FACETS = [
  { key: "type", label: "Production type", get: (a) => a.production_type || "Not set" },
  { key: "sub", label: "Format", get: (a) => a.production_sub_type || "Not set" },
  { key: "studio", label: "Studio", get: (a) => a.studio_affiliation || "Not set" },
  { key: "loc", label: "State / province", get: (a) => regionOf(a.production_location) },
  { key: "status", label: "Status", get: (a) => a.status, fmt: (v) => STATUS[v] || v, order: (v) => Object.keys(STATUS).indexOf(v) },
  { key: "rev", label: "Reviewer", get: (a) => a.assigned_reviewer || "", fmt: (v) => (v ? personName(v) || "Unknown" : "Unassigned") },
];

async function renderCompare(qid) {
  renderBar();
  $app.innerHTML = `<p class="loading">Loading productions…</p>`;
  const [p, r] = await Promise.all([
    sb.from("productions").select("production_id,production_name,production_type,production_sub_type,studio_affiliation,production_location,submission_date,assigned_reviewer,status,footprint_is_sample," + FOOTPRINT_COLS).neq("status", "draft"),
    fetchAll(() => sb.from("responses").select("production_id,question_id,prep_answer,wrap_answer").order("response_id")),
  ]);
  if (p.error || r.error) { const e = p.error || r.error; fail(e); $app.innerHTML = notice("Couldn't load productions", friendly(e)); return; }
  const ans = {};
  const active = new Set(S.qs.map((q) => q.question_id));
  for (const x of r.data) if (active.has(x.question_id)) (ans[x.production_id] ||= {})[x.question_id] = { prep: x.prep_answer || null, wrap: x.wrap_answer || null };
  S.cmpData = { apps: p.data, ans };
  if (qid && S.qs.some((q) => q.question_id === qid)) { S.cmp.q = qid; S.cmp.mode = "practice"; }
  if (!S.cmp.q) S.cmp.q = S.qs[0]?.question_id;
  drawCompare();
}

const activeQs = () => (S.cmpF.depts.length ? S.qs.filter((q) => S.cmpF.depts.includes(q.department_id)) : S.qs);
function practiceScore(appId, stage, excludeQ, qs = activeQs()) {
  const a = S.cmpData.ans[appId] || {}, answers = {};
  for (const [qid, v] of Object.entries(a)) if (v[stage]) answers[qid] = v[stage];
  const sc = peachScore(answers, qs.filter((q) => q.question_id !== excludeQ));
  return sc.answered ? sc.pct : null;
}

const avg = (xs) => (xs.length ? xs.reduce((t, v) => t + v, 0) / xs.length : null);
function groupStats(list, stage, q) {
  const dec = list.filter((a) => a.status === "approved" || a.status === "rejected");
  const s = avg(list.map((a) => practiceScore(a.production_id, stage, q)).filter((v) => v != null));
  const metrics = {};
  for (const m of METRICS) { const vals = list.map(m.get).filter((v) => v != null); metrics[m.key] = { v: avg(vals), n: vals.length }; }
  return {
    n: list.length, score: s == null ? null : Math.round(s),
    approved: dec.filter((a) => a.status === "approved").length, decided: dec.length,
    metrics, total: avg(list.map(tonnesCO2).filter((v) => v != null)),
  };
}

const pctDiff = (a, b) => (a != null && b ? Math.round(((a - b) / b) * 100) : null);

// A production passes when it matches every active filter (optionally ignoring one facet, for chip counts).
function passesFilters(a, exceptKey) {
  const F = S.cmpF;
  for (const f of CMP_FACETS) {
    if (f.key === exceptKey) continue;
    const sel = F.sel[f.key];
    if (sel.length && !sel.includes(f.get(a))) return false;
  }
  if (F.from && (!a.submission_date || a.submission_date < F.from)) return false;
  if (F.to && (!a.submission_date || a.submission_date > F.to)) return false;
  if (F.dmin !== "" && !(a.shoot_days >= +F.dmin)) return false;
  if (F.dmax !== "" && !(a.shoot_days <= +F.dmax)) return false;
  if (F.footprintOnly && metricOf(S.cmp.metric).get(a) == null) return false;
  return true;
}
function activeFilterLabels() {
  const F = S.cmpF, out = [];
  for (const f of CMP_FACETS) if (F.sel[f.key].length) out.push(`${f.label}: ${F.sel[f.key].map((v) => (f.fmt ? f.fmt(v) : v)).join(", ")}`);
  if (F.from || F.to) out.push(`Submitted ${F.from ? "from " + date(F.from) : ""}${F.from && F.to ? " " : ""}${F.to ? "to " + date(F.to) : ""}`);
  if (F.dmin !== "" || F.dmax !== "") out.push(`Shoot days ${F.dmin !== "" ? F.dmin : "any"}–${F.dmax !== "" ? F.dmax : "any"}`);
  if (F.depts.length) out.push(`Practices from ${F.depts.map((id) => S.depts.find((d) => d.department_id === id)?.name || id).join(", ")}`);
  if (F.footprintOnly) out.push(`Reported ${metricOf(S.cmp.metric).short} only`);
  return out;
}

function filterPanel(all, shown) {
  const F = S.cmpF;
  const facet = (f) => {
    const values = [...new Set(all.map(f.get))];
    if (values.length < 2 && !F.sel[f.key].length) return "";
    values.sort((x, y) => (f.order ? f.order(x) - f.order(y) : String(f.fmt ? f.fmt(x) : x).localeCompare(String(f.fmt ? f.fmt(y) : y))));
    return `<fieldset class="facet"><legend class="label">${f.label}</legend><div class="chips">${values.map((v) => {
      const n = all.filter((a) => passesFilters(a, f.key) && f.get(a) === v).length;
      const on = F.sel[f.key].includes(v);
      return `<button class="chip fchip" data-facet="${f.key}" data-val="${esc(v)}" aria-pressed="${on}" ${!n && !on ? "disabled" : ""}>${esc(f.fmt ? f.fmt(v) : v)} <span class="cnt">${n}</span></button>`;
    }).join("")}</div></fieldset>`;
  };
  const labels = activeFilterLabels();
  return `<section class="panel cmp-filters">
    <div class="fhead">
      <button class="link ftoggle" id="fToggle" aria-expanded="${S.cmpFiltersOpen}">${S.cmpFiltersOpen ? "Hide filters" : "Show filters"}${labels.length ? ` <span class="pill role">${labels.length} active</span>` : ""}</button>
      <span class="muted">Showing <b>${shown}</b> of ${all.length} submitted productions</span>
      ${labels.length ? `<button class="link" id="fClear">Clear all</button>` : ""}
    </div>
    ${S.cmpFiltersOpen ? `<div class="fgrid">
      ${CMP_FACETS.map(facet).join("")}
      <fieldset class="facet"><legend class="label">Submitted</legend>
        <div class="frange"><input type="date" id="f-from" value="${esc(F.from)}" aria-label="Submitted on or after"><span class="muted">to</span><input type="date" id="f-to" value="${esc(F.to)}" aria-label="Submitted on or before"></div></fieldset>
      <fieldset class="facet"><legend class="label">Shoot days</legend>
        <div class="frange"><input type="number" min="1" id="f-dmin" value="${esc(F.dmin)}" placeholder="Min" aria-label="Minimum shoot days"><span class="muted">to</span><input type="number" min="1" id="f-dmax" value="${esc(F.dmax)}" placeholder="Max" aria-label="Maximum shoot days"></div></fieldset>
      <fieldset class="facet"><legend class="label">Departments that count toward the score</legend><div class="chips">${S.depts.filter((d) => S.qs.some((q) => q.department_id === d.department_id)).map((d) =>
        `<button class="chip" data-dept="${d.department_id}" aria-pressed="${F.depts.includes(d.department_id)}">${esc(d.name)}</button>`).join("")}</div>
        <small class="muted">None selected means all departments.</small></fieldset>
      <fieldset class="facet"><legend class="label">Footprint</legend>
        <label class="check"><input type="checkbox" id="f-fp" ${F.footprintOnly ? "checked" : ""}>Only productions that reported ${esc(metricOf(S.cmp.metric).short)}</label></fieldset>
    </div>` : ""}
    ${labels.length && !S.cmpFiltersOpen ? `<p class="fsummary muted">${labels.map(esc).join(" · ")}</p>` : ""}
  </section>`;
}

function drawCompare() {
  const { mode, threshold, stage, q } = S.cmp;
  const byPractice = mode === "practice";
  const all = S.cmpData.apps;
  const apps = all.filter((a) => passesFilters(a));
  const qs = activeQs();
  const ansOf = (a, qid) => S.cmpData.ans[a.production_id]?.[qid]?.[stage] || null;
  const question = S.qs.find((x) => x.question_id === q);
  const dept = Object.fromEntries(S.depts.map((d) => [d.department_id, d.name]));
  const stageWord = stage === "wrap" ? "at wrap" : "at prep";
  const types = new Set(apps.map((a) => a.production_type || "Not set"));

  let yes, no;
  if (byPractice) { yes = apps.filter((a) => ansState(question, ansOf(a, q)) === "yes"); no = apps.filter((a) => ansState(question, ansOf(a, q)) === "no"); }
  else {
    yes = apps.filter((a) => (practiceScore(a.production_id, stage) ?? -1) >= threshold);
    no = apps.filter((a) => (practiceScore(a.production_id, stage) ?? -1) < threshold);
  }
  const blank = byPractice ? apps.filter((a) => !ansOf(a, q)).length : apps.length - yes.length - no.length;
  const naCount = byPractice ? apps.filter((a) => ansState(question, ansOf(a, q)) === "na").length : 0;
  const exclude = byPractice ? q : null;
  const Y = groupStats(yes, stage, exclude), N = groupStats(no, stage, exclude);
  const yesLabel = byPractice ? "Implemented" : "Compliant", noLabel = byPractice ? "Did not implement" : "Non-compliant";
  const sample = apps.some((a) => a.footprint_is_sample);
  const M = metricOf(S.cmp.metric);
  const noFootprint = apps.filter((a) => M.get(a) == null).length;

  // Which practices go with a better result on the chosen metric.
  const impact = qs.map((x) => {
    const y = apps.filter((a) => ansState(x, ansOf(a, x.question_id)) === "yes"), n = apps.filter((a) => ansState(x, ansOf(a, x.question_id)) === "no");
    const ys = groupStats(y, stage, x.question_id), ns = groupStats(n, stage, x.question_id);
    return { x, ys: ys.metrics[M.key].v, ns: ns.metrics[M.key].v, yn: ys.n, nn: ns.n, diff: mdiff(M, ys.metrics[M.key].v, ns.metrics[M.key].v) };
  }).sort((a, b) => M.higher ? (b.diff ?? -999) - (a.diff ?? -999) : (a.diff ?? 999) - (b.diff ?? 999));
  const maxDay = Math.max(1, ...impact.flatMap((i) => [i.ys || 0, i.ns || 0]));
  const withData = impact.filter((i) => i.diff != null);
  const impactShown = S.cmpShowAll ? impact : withData.slice(0, 12);

  const cols = [...apps].sort((a, b) => (practiceScore(b.production_id, stage) ?? -1) - (practiceScore(a.production_id, stage) ?? -1));
  const small = (g) => g.n > 0 && g.n < 3 ? `<span class="tag">Small group</span>` : "";
  const groupCard = (label, cls, g, list) => `
    <section class="panel cmp-card ${cls}">
      <div class="cmp-head"><span class="label">${label} · ${g.n} production${g.n === 1 ? "" : "s"}</span>${small(g)}</div>
      <div class="cmp-stats">
        <div class="lead"><strong>${mfmt(M, g.metrics[M.key].v).replace(/ \S+$/, "") }</strong><small>${M.unit === "%" ? "of waste diverted from landfill" : `${esc(M.unit)} ${esc(M.noun)} per shoot day`}${g.metrics[M.key].n < g.n ? ` (${g.metrics[M.key].n} of ${g.n} reported)` : ""}</small></div>
        ${M.key === "co2" ? `<div><strong>${t1(g.total)}</strong><small>t CO₂ per production</small></div>` : `<div><strong>${t1(g.metrics.co2.v)}</strong><small>t CO₂ per shoot day</small></div>`}
        <div><strong>${g.score ?? "–"}${g.score != null ? "%" : ""}</strong><small>${byPractice ? "score on other practices" : "practice score"}</small></div>
        <div><strong>${g.decided ? Math.round((g.approved / g.decided) * 100) + "%" : "–"}</strong><small>${g.decided ? `approved (${g.approved} of ${g.decided} decided)` : "none decided yet"}</small></div>
      </div>
      <ul class="cmp-list">${list.map((a) => `<li><a href="#app-${a.production_id}">${esc(a.production_name)}</a><span class="muted">${esc(a.production_type || "")}</span><span class="mono co2-chip">${M.get(a) == null ? "not reported" : mfmt(M, M.get(a)) + (M.unit === "%" ? " diverted" : "/day")}</span>${pill(a.status)}</li>`).join("") || `<li class="muted">None</li>`}</ul>
    </section>`;

  const ym = Y.metrics[M.key].v, nm = N.metrics[M.key].v, dd = mdiff(M, ym, nm);
  let verdict = "";
  if (Y.n && N.n) {
    const parts = [];
    if (dd != null) parts.push(M.unit === "%"
      ? `diverted <b>${Math.round(ym)}%</b> of their waste from landfill, versus ${Math.round(nm)}%`
      : `${M.verb} <b>${dd === 0 ? `the same ${esc(M.noun)}` : `${Math.abs(dd)}% ${dd < 0 ? "less" : "more"} ${esc(M.noun)}`}</b> per shoot day (${mfmt(M, ym)} vs. ${mfmt(M, nm)})`);
    if (Y.decided && N.decided) parts.push(`were approved ${Math.round(Y.approved / Y.decided * 100)}% of the time versus ${Math.round(N.approved / N.decided * 100)}%`);
    verdict = parts.length ? `${byPractice ? "Productions that did this" : "Compliant productions"} ${parts.join(", and ")}.` : "";
  }

  $app.innerHTML = `
    <div class="page-head">
      <div><p class="eyebrow">Best practices & footprint</p><h1>Compare productions</h1>
        <p class="muted" style="max-width:66ch">Split submitted productions into those that follow best practices and those that don't, then compare their carbon, electricity, fuel, water and waste. Amounts are per shoot day so productions of different lengths compare fairly.</p></div>
    </div>
    <div class="panel cmp-controls">
      <label class="field"><span>Compare by</span><select id="cmp-mode">
        <option value="compliance" ${!byPractice ? "selected" : ""}>Overall compliance</option>
        <option value="practice" ${byPractice ? "selected" : ""}>A single practice</option></select></label>
      ${byPractice ? `<label class="field cmp-wide"><span>Practice</span><select id="cmp-q">${S.depts.map((d) => {
        const dq = S.qs.filter((x) => x.department_id === d.department_id);
        return dq.length ? `<optgroup label="${esc(d.name)}">${dq.map((x) => `<option value="${x.question_id}" ${x.question_id === q ? "selected" : ""}>${esc(qTitle(x))}</option>`).join("")}</optgroup>` : "";
      }).join("")}</select></label>`
      : `<label class="field cmp-wide"><span>Compliant at a practice score of at least</span><div class="thresh"><input type="range" id="cmp-th" min="10" max="100" step="5" value="${threshold}"><output class="mono" id="cmp-th-out">${threshold}%</output></div></label>`}
      <div class="field"><span>Stage</span><div class="chips">${[["wrap", "Wrap"], ["prep", "Prep"]].map(([k, l]) => `<button class="chip" data-stage="${k}" aria-pressed="${stage === k}">${l}</button>`).join("")}</div></div>
      <label class="field"><span>Compare on</span><select id="cmp-metric">${METRICS.map((m) => `<option value="${m.key}" ${m.key === M.key ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></label>
    </div>
    ${filterPanel(all, apps.length)}

    <h2 class="cmp-title">${byPractice ? esc(question?.question_text || "") : "Compliant vs. non-compliant productions"}
      <span class="muted">${byPractice ? `${esc(dept[question?.department_id] || "")} · ${stageWord}` : `Practice score of ${threshold}% or more ${stageWord}${S.cmpF.depts.length ? ", selected departments" : ""}`}</span></h2>
    ${sample ? `<p class="sample-note"><span class="tag">Sample figures</span> Some footprint numbers here are invented demo data, not real production results.</p>` : ""}
    <p class="cmp-verdict ${verdict ? "" : "muted"}">${verdict || (apps.length ? "Both groups need at least one production to compare. Try a different threshold or loosen the filters." : "No productions match these filters.")}</p>
    <div class="cmp-grid">
      ${groupCard(yesLabel, "yes", Y, yes)}
      ${groupCard(noLabel, "no", N, no)}
    </div>
    <section class="panel block">
      <div class="block-head"><h2>Footprint side by side</h2><span class="muted">Group averages · click a row to compare on it</span></div>
      <div class="table-scroll"><table class="mtable">
        <thead><tr><th>Metric</th><th class="num">${yesLabel}</th><th class="num">${noLabel}</th><th class="num">Difference</th><th class="num">Reported</th></tr></thead>
        <tbody>${METRICS.map((m) => { const a = Y.metrics[m.key], b = N.metrics[m.key], d = mdiff(m, a.v, b.v), good = mgood(m, d);
          return `<tr class="row ${m.key === M.key ? "sel" : ""}" data-metric="${m.key}"><td>${esc(m.label)}${m.higher ? ' <span class="muted">(higher is better)</span>' : ""}</td>
            <td class="num">${mfmt(m, a.v)}</td><td class="num">${mfmt(m, b.v)}</td>
            <td class="num"><b class="${good == null ? "" : good ? "good" : "worse"}">${mdiffText(m, d)}</b></td>
            <td class="num muted">${a.n + b.n} of ${Y.n + N.n}</td></tr>`; }).join("")}</tbody>
      </table></div>
    </section>
    <p class="muted cmp-foot">${[
      blank ? `${blank} production${blank > 1 ? "s" : ""} left this blank ${stageWord} and ${blank > 1 ? "aren't" : "isn't"} in either group.` : "",
      naCount ? `${naCount} answered N/A and ${naCount > 1 ? "aren't" : "isn't"} in either group.` : "",
      byPractice && question && !isYesNo(question) ? "For tiered questions, any answer that earns points counts as implemented." : "",
      noFootprint ? `${noFootprint} production${noFootprint > 1 ? "s haven't" : " hasn't"} reported ${esc(M.short)} yet.` : "",

function downloadCsv(name, rows) {
  const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function exportApps() {

  downloadCsv(`ema-applications-${stamp()}.csv`, [

     "Prep points (self)", "Prep available", "Prep %", "Wrap points (self)", "Wrap available", "Wrap %", "N/A answers (wrap)", "Innovation bonus (wrap)",
     "Verified wrap points", "Shoot days", "Diesel (gal)", "Gasoline (gal)", "Electricity (kWh)", "Air (passenger-miles)", "Water (gal)", "Landfill (lbs)", "Recycled (lbs)", "Composted (lbs)",
     "t CO2", "t CO2 per shoot day", "kWh per shoot day", "Water gal per shoot day", "Waste lbs per shoot day", "Waste diversion %", "Sample footprint"],
    ...apps.map((a) => { const p = sc(a, "prep"), w = sc(a, "wrap");

async function adminCall(body) {
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

    S.delInfo = error ? { error: true } : { owned: (data || []).filter((p) => p.submitted_by === id), reviewing: (data || []).filter((p) => p.assigned_reviewer === id) };
    drawUsers();
  }));
  el.querySelector("#delCancel")?.addEventListener("click", () => { S.delUser = null; drawUsers(); });
  el.querySelector("#delConfirm")?.addEventListener("click", async () => {
    const id = S.delUser, x = S.people.find((y) => y.id === id), name = x.full_name || x.email;
    const typed = document.getElementById("delType").value.trim().toLowerCase();
    if (typed !== "delete") { document.getElementById("delType").setAttribute("aria-invalid", "true"); return toast('Type "delete" to confirm.', "bad"); }
    const to = document.getElementById("delTo")?.value || null;
    setBusy(true);
    try {
      const res = await adminCall({ action: "delete", user_id: id, transfer_to: to });
      S.people = S.people.filter((y) => y.id !== id); S.delUser = null; S.delInfo = null;
      const dest = to && S.people.find((y) => y.id === to);
      toast(`${name} deleted${res.moved ? ` · ${res.moved} application${res.moved === 1 ? "" : "s"} moved to ${dest?.full_name || dest?.email}` : ""}`);
      drawUsers();
    } catch (err) { fail(err); } finally { setBusy(false); }
  });
  el.querySelectorAll("[data-deactivate],[data-activate]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.closest("tr").dataset.uid, x = S.people.find((y) => y.id === id), active = b.hasAttribute("data-activate");
    if (!active && b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Confirm deactivate?"; return; }
    setBusy(true);
    try { await adminCall({ action: "set_active", user_id: id, active }); x.deactivated_at = active ? null : new Date().toISOString();
      toast(`${x.full_name || x.email} ${active ? "reactivated" : "deactivated"}`); drawUsers(); }
    catch (err) { fail(err); } finally { setBusy(false); }
  }));
}

function deleteRow(x) {
  const name = esc(x.full_name || x.email), info = S.delInfo;
  const others = S.people.filter((y) => y.id !== x.id && !y.deactivated_at);
  let body;
  if (!info) body = `<p class="muted">Checking their applications…</p>`;
  else if (info.error) body = `<p>Couldn't check their applications. Their applications will be kept without an owner.</p>`;
  else {
    const n = info.owned.length, r = info.reviewing.length;
    body = `${n ? `<p><b>${name}</b> owns ${n} application${n === 1 ? "" : "s"}: ${info.owned.slice(0, 4).map((p) => esc(p.production_name)).join(", ")}${n > 4 ? ` and ${n - 4} more` : ""}.</p>
      <label class="field"><span>Move their applications to</span><select id="delTo">
        <option value="">Nobody: keep them without an owner (staff can still see them)</option>
        ${others.map((y) => `<option value="${esc(y.id)}">${esc(y.full_name || y.email)} · ${esc(y.role)}</option>`).join("")}</select></label>`
      : `<p><b>${name}</b> doesn't own any applications.</p>`}
      ${r ? `<p>${r} application${r === 1 ? " is" : "s are"} assigned to them for review and will become unassigned.</p>` : ""}`;
  }
  return `<tr class="delrow"><td colspan="6"><div class="delbox" role="group" aria-label="Delete ${name}">
    <p><b>Delete ${name} permanently?</b> They can't sign in again and this can't be undone. Answers, reviews and crew contacts they entered stay in the portal.</p>
    ${body}
    <label class="field"><span>Type <b>delete</b> to confirm</span><input id="delType" autocomplete="off" spellcheck="false"></label>
    <div class="row-actions"><button class="danger-fill" id="delConfirm" ${info ? "" : "disabled"}>Delete permanently</button><button id="delCancel">Cancel</button></div>
  </div></td></tr>`;
}

function drawLogoPrev() {
  const el = document.getElementById("logoPrev"); if (!el) return;
  el.innerHTML = S.themeDraft.logo_url ? `<img src="${esc(S.themeDraft.logo_url)}" alt="Current logo">` : `<span class="brand"><span class="mark">${esc(S.themeDraft.org)}</span></span>`;
}
function checkContrast() {
  const c = S.themeDraft.colors, el = document.getElementById("contrastNote"); if (!el) return;
  const issues = [];
  if (contrast(c.ink, c.paper) < 4.5) issues.push("Text on the background");
  if (contrast(c.primary, c.paper) < 3) issues.push("Primary color on the background");
  el.className = "contrast-note " + (issues.length ? "warn" : "ok");
  el.textContent = issues.length ? `${issues.join(" and ")} may be hard to read. Try a darker text or primary color, or a lighter background.` : "Text and buttons have enough contrast to read comfortably.";
}
function drawDesignActions() {
  const changed = JSON.stringify(S.themeDraft) !== JSON.stringify(S.theme);
  $actions.innerHTML = `<div class="actions"><div class="wrap"><span class="hint">${changed ? "Unsaved changes. Only you see them until you save." : "This is the current look for everyone."}</span>

}

      <div class="qrow-grid">
        <label class="field"><span>Evidence required</span><input data-k="documentation" value="${esc(x.documentation)}"></label>
        ${isYesNo(x) ? `<label class="field"><span>Points for Yes</span><input data-k="points_possible" type="number" min="0" step="0.5" value="${x.points_possible ?? ""}"></label>`
          : `<div class="field"><span>Answer choices and points</span><p class="optline">${esc(optText(x))}</p></div>`}
        <label class="check"><input type="checkbox" data-k="active" ${x.active ? "checked" : ""}>In use</label>
        <button data-save>Save</button>
      </div></div>`;
  const deptBlock = (dep) => { const list = active.filter((x) => x.department_id === dep.department_id);
    return `<details class="panel block qdept"><summary class="block-head"><h3>${esc(dep.name)}</h3><span class="mono muted">${list.length} actions · ${fmt(list.filter((x) => !x.is_innovation).reduce((t, x) => t + (+x.points_possible || 0), 0))} pts</span></summary>
      ${list.map(row).join("")}
      <div class="qrow qnew" data-new="${dep.department_id}">
        <label class="field"><span>Add a Yes / No / N/A action to ${esc(dep.name)}</span><textarea data-k="question_text" rows="2" placeholder="Title: what the production should do"></textarea></label>
        <div class="qrow-grid">
          <label class="field"><span>Evidence required</span><input data-k="documentation" placeholder="e.g. If yes, provide the vendor name."></label>
          <label class="field"><span>Points for Yes</span><input data-k="points_possible" type="number" min="0" step="0.5" placeholder="Pts"></label>
          <label class="field"><span>Impact category</span><select data-k="category">${["Energy", "Materials & Circularity", "Communication & Leadership"].map((c) => `<option>${c}</option>`).join("")}</select></label>
          <button class="primary" data-add>Add action</button>
        </div></div>
    </details>`; };
  $app.innerHTML = `
    <div class="page-head"><div><p class="eyebrow">Staff · PEACH v2.0</p><h1>Questions</h1>
      <p class="muted" style="max-width:66ch">${active.length} actions in use, worth ${fmt(possible())} base points plus ${fmt(bonusPossible())} Innovation bonus points. Changes apply to every application, including ones already scored. Tiered answer choices come from the PEACH workbook and aren't edited here.</p></div></div>
    ${depts.filter((dep) => active.some((x) => x.department_id === dep.department_id)).map(deptBlock).join("")}
    ${retired.length ? `<details class="panel block qdept"><summary class="block-head"><h3>Retired pilot questions</h3><span class="mono muted">${retired.length} · kept so old answers aren't lost</span></summary>${retired.map(row).join("")}</details>` : ""}
    <section class="panel block"><div class="block-head"><h3>Emission factors</h3><span class="muted">kg CO₂ per unit · used for every footprint</span></div>
      ${(S.factors || []).map((f) => `<div class="admin-row factor-row" data-fkey="${esc(f.key)}">
        <div><b>${esc(f.label)}</b> <span class="muted">per ${esc(f.unit)}</span><div class="muted" style="font-size:.8rem">${esc(f.source || "")}</div></div>
        <input aria-label="kg CO2 per ${esc(f.unit)}" type="number" min="0" step="any" value="${f.kg_co2_per_unit}" data-fval>
        <input aria-label="Source" value="${esc(f.source || "")}" placeholder="Source" data-fsrc>
        <button data-fsave>Save</button></div>`).join("")}
    </section>
    <section class="panel block"><div class="block-head"><h3>Add a department</h3></div>
      <div class="admin-row" style="grid-template-columns:minmax(0,1fr) auto"><input id="newDept" placeholder="e.g. Visual Effects" aria-label="Department name"><button class="primary" id="addDept">Add department</button></div></section>`;
  const vals = (el) => { const o = {}; el.querySelectorAll("[data-k]").forEach((i) => (o[i.dataset.k] = i.type === "checkbox" ? i.checked : i.type === "number" ? num(i.value) : i.value.trim() || null)); return o; };
  const refresh = async () => { try { await reloadQuestions(); } catch (e) { fail(e); } };
  $app.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-qid]"), x = all.find((y) => y.question_id === +r.dataset.qid), v = vals(r);
    if (!v.question_text) return toast("An action needs text.", "bad");
    if ("points_possible" in v) {
      if (v.points_possible == null || v.points_possible < 0) return toast("Enter points of zero or more.", "bad");
      if (x.answer_options) v.answer_options = x.answer_options.map((o) => (o.label === "Yes" ? { ...o, points: v.points_possible } : o));
    }
    const { error } = await sb.from("questions").update(v).eq("question_id", x.question_id);
    if (error) return fail(error);
    Object.assign(x, v); toast("Saved"); refresh();
  }));
  $app.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-new]"), v = vals(r);
    if (!v.question_text) return toast("Type the action first.", "bad");
    if (v.points_possible == null || v.points_possible < 0) return toast("Enter the points for Yes.", "bad");
    const { error } = await sb.from("questions").insert({ ...v, department_id: +r.dataset.new, active: true, form_version: "Custom", is_ema_relevant: true,
      sort_order: Math.max(0, ...all.map((y) => y.sort_order || 0)) + 1,
      answer_options: [{ label: "Yes", points: v.points_possible, na: false }, { label: "No", points: 0, na: false }, { label: "N/A", points: 0, na: true }] });
    if (error) return fail(error); toast("Action added"); await refresh(); renderQuestions();
  }));
  $app.querySelectorAll("[data-fsave]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-fkey]"); const v = num(r.querySelector("[data-fval]").value);
    if (v == null || isNaN(v) || v < 0) return toast("Enter a factor of zero or more.", "bad");
    const { error } = await sb.from("emission_factors").update({ kg_co2_per_unit: v, source: r.querySelector("[data-fsrc]").value.trim() || null, updated_at: new Date().toISOString() }).eq("key", r.dataset.fkey);
    if (error) return fail(error);
    const f = S.factors.find((x) => x.key === r.dataset.fkey); if (f) f.kg_co2_per_unit = v;
    toast("Emission factor saved");
  }));
  document.getElementById("addDept").addEventListener("click", async () => {
    const name = document.getElementById("newDept").value.trim();
    if (!name) return toast("Type a department name.", "bad");
    const { error } = await sb.from("departments").insert({ name, sort_order: Math.max(0, ...depts.map((x) => x.sort_order || 0)) + 1 });
    if (error) return fail(error); toast("Department added. Add an action to it so it shows on the form."); renderQuestions();
  });
}

boot();
</script>
</body>
</html>
