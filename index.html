<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EMA Green Seal Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" id="themeFonts" href="https://fonts.googleapis.com/css2?family=Gloock&family=Jost:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
/* Layout: call-sheet ledger. Department blocks with PREP / WRAP columns, one sticky action bar. */
/* Theme: EMA "United by Nature" — forest green, marigold sun, coral bloom on cream paper.
   These are defaults; the portal's saved theme (Design page) overrides them at load. */
:root {
  --bg: #F5EFE3;
  --surface: #FBF8F2;
  --sunk: #ECE5D7;
  --ink: #1E261D;
  --muted: #5D6455;
  --line: #DDD4C3;
  --accent: #2F4A30;
  --accent-ink: #FBF8F2;
  --accent-soft: #E0E3D3;
  --hl: #F2AE1C; --hl-soft: #F8E2AE;
  --coral: #E4604E;
  --ok: #2F6B3F; --ok-soft: #DCE8D6;
  --warn: #996605; --warn-soft: #F7E5BD;
  --bad: #B33F2E; --bad-soft: #F5DCD4;
  --info: #345F7E; --info-soft: #DCE5EC;
  --s1: #2F8A4A; --s2: #3A6FC0; --s3: #D9573F; --s4: #8A55C0; --s5: #E0A11B; --s6: #16A39E; --s-other: #9A968C;
  --display: "Gloock", Georgia, "Times New Roman", serif;
  --body: "Jost", "Futura", "Century Gothic", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --hw: 400; --hs: normal; --hcase: uppercase;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121711; --surface: #1A2119; --sunk: #0E120D; --ink: #EFE7D8; --muted: #A49D8D;
    --line: #2E3629; --accent: #9DC28F; --accent-ink: #111610; --accent-soft: #23301F;
    --hl: #F2B53A; --hl-soft: #3A2E12; --coral: #F0846F;
    --ok: #7CC48F; --ok-soft: #1B3121; --warn: #E8B45C; --warn-soft: #3A2C12;
    --bad: #F08A78; --bad-soft: #3D1E18; --info: #93B7D6; --info-soft: #1B2A36;
    --s1: #34914F; --s2: #4F84D6; --s3: #D8604A; --s4: #9672D2; --s5: #C08A14; --s6: #1A9B96; --s-other: #6E7468;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121711; --surface: #1A2119; --sunk: #0E120D; --ink: #EFE7D8; --muted: #A49D8D;
  --line: #2E3629; --accent: #9DC28F; --accent-ink: #111610; --accent-soft: #23301F;
  --hl: #F2B53A; --hl-soft: #3A2E12; --coral: #F0846F;
  --ok: #7CC48F; --ok-soft: #1B3121; --warn: #E8B45C; --warn-soft: #3A2C12;
  --bad: #F08A78; --bad-soft: #3D1E18; --info: #93B7D6; --info-soft: #1B2A36;
  --s1: #34914F; --s2: #4F84D6; --s3: #D8604A; --s4: #9672D2; --s5: #C08A14; --s6: #1A9B96; --s-other: #6E7468;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1, h2, h3 { line-height: 1.1; margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--display); font-weight: var(--hw); font-stretch: var(--hs); }
h1 { font-size: clamp(1.9rem, 4.2vw, 2.6rem); text-transform: var(--hcase); letter-spacing: .01em; }
h2 { font-size: 1.4rem; }
h3 { font-family: var(--body); font-size: .92rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
p { margin: 0; }
a { color: var(--accent); }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow, .label {
  font: 600 .72rem/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.bar { background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 -3px 0 var(--hl); padding-top: env(safe-area-inset-top, 0px); }
.bar .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); isolation: isolate; }
.brand .mark { color: #1E261D; position: relative; font: var(--hw) 1.3rem/1 var(--display); font-stretch: var(--hs); letter-spacing: .04em; padding: 0 2px; }
.brand .mark::before { content: ""; position: absolute; z-index: -1; width: 1.75em; height: 1.75em; border-radius: 50%; background: var(--hl); left: 50%; top: 50%; transform: translate(-58%, -50%); }
.brand img { height: 34px; width: auto; max-width: 160px; object-fit: contain; display: block; }
.brand .bname { font-size: .78rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 6px 10px; border-radius: var(--r); text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; }

/* Controls */
button, .btn {
  font: 600 .9rem/1 var(--body); border-radius: var(--r); padding: 10px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--bad); }
button.link { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; }
button:disabled { opacity: .55; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea {
  font: 400 .95rem/1.4 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 9px 10px; width: 100%; min-width: 0;
}
input:disabled, select:disabled, textarea:disabled { background: var(--sunk); color: var(--muted); }
textarea { resize: vertical; }
.field { display: grid; gap: 5px; }
.field > span { font-size: .82rem; font-weight: 600; color: var(--muted); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  font: 600 .75rem/1.4 var(--body); letter-spacing: .03em; white-space: nowrap;
  background: var(--sunk); color: var(--muted);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-submitted { background: var(--info-soft); color: var(--info); }
.s-in_review { background: var(--warn-soft); color: var(--warn); }
.s-approved  { background: var(--ok-soft); color: var(--ok); }
.s-rejected  { background: var(--bad-soft); color: var(--bad); }
.role { background: var(--accent-soft); color: var(--accent); }
.role::before { display: none; }

main { padding-block: 28px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head > div { display: grid; gap: 6px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.notice { padding: 28px; display: grid; gap: 10px; justify-items: start; }
.loading { color: var(--muted); padding: 40px 0; }

/* List */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 7px 11px; font-size: .84rem; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.toolbar input[type=search] { max-width: 260px; margin-left: auto; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font: 600 .72rem/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--sunk); }
td .name { font-weight: 650; color: var(--ink); text-decoration: none; }
td .sub { font-size: .82rem; color: var(--muted); }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Application */
.back { display: inline-block; margin-bottom: 14px; font-weight: 600; text-decoration: none; }
.meta { display: flex; gap: 8px 14px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
.tally > div { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; gap: 4px; }
.tally > div:last-child { border-right: 0; }
.tally strong { font: 600 1.35rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.tally strong small { font-size: .8rem; color: var(--muted); font-weight: 400; }
section.block { margin-bottom: 22px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.block-body { padding: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }

.dept { border-top: 1px solid var(--line); }
.dept:first-of-type { border-top: 0; }
.dept-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 12px 18px; background: var(--sunk);
}
.dept-head .mono { font-size: .85rem; color: var(--muted); }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; padding: 16px 18px; border-top: 1px solid var(--line); }
.dept-head + .q { border-top: 0; }
.q-text { display: grid; gap: 6px; align-content: start; }
.q-text p { font-weight: 550; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 500 .72rem/1.5 var(--mono); padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.q-ans { display: flex; gap: 14px; align-items: start; }
.yn { border: 0; margin: 0; padding: 0; display: grid; gap: 4px; }
.yn legend { padding: 0; margin-bottom: 4px; }
.yn .opts { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.yn label { position: relative; padding: 7px 13px; font-weight: 600; font-size: .86rem; cursor: pointer; color: var(--muted); background: var(--surface); }
.yn label + label { border-left: 1px solid var(--line); }
.yn input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.yn label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.yn label:has(input[value="yes" i]:checked) { background: var(--ok-soft); color: var(--ok); }
.yn label:has(input[value="no" i]:checked) { background: var(--bad-soft); color: var(--bad); }
.yn label:has(input:disabled) { cursor: default; }
.q-wide { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.q-score { display: grid; grid-template-columns: 110px 110px minmax(0, 1fr); gap: 10px; padding: 12px; border-radius: var(--r); background: var(--accent-soft); }
.q-score input { background: var(--surface); }
.earned { font-size: .86rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.earned b { color: var(--ink); font-family: var(--mono); }

.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); }
.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 18px rgb(0 0 0 / .06);
}
body:has(.actions) main { padding-bottom: 140px; }
.actions .wrap { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.actions .hint { margin-right: auto; color: var(--muted); font-size: .88rem; }

/* Auth */
.auth { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; padding-top: 24px; }
.auth-intro { display: grid; gap: 16px; max-width: 32rem; padding-top: 28px; position: relative; isolation: isolate; }
.auth-intro::before { content: ""; position: absolute; z-index: -1; width: 210px; height: 210px; border-radius: 50%; background: var(--hl); left: -34px; top: -6px; opacity: .92; }
.auth-intro::after { content: ""; position: absolute; z-index: -1; width: 46px; height: 46px; border-radius: 50%; background: var(--coral); left: 150px; top: -20px; opacity: .9; }
.auth-intro h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.02; }
@media (max-width: 600px) { .auth-intro::before { width: 150px; height: 150px; left: -40px; top: 0; } .auth-intro::after { left: 104px; top: -14px; width: 36px; height: 36px; } }
.auth-logo { height: 56px; width: auto; max-width: 220px; object-fit: contain; }
.auth-intro ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
.auth form { display: grid; gap: 14px; padding: 24px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.form-msg { font-size: .9rem; padding: 10px 12px; border-radius: var(--r); background: var(--info-soft); color: var(--ink); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: var(--r); font-weight: 600; font-size: .9rem;
  max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .2);
}
.toast.bad { background: var(--bad); color: #fff; }

.evidence { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: .9rem; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; min-width: 0; }
.files li { display: inline-flex; gap: 8px; align-items: baseline; min-width: 0; }
.files .link { padding: 0; font-size: .9rem; text-align: left; overflow-wrap: anywhere; }
.files .mono { font-size: .78rem; }
.ev-add { padding: 6px 10px; font-size: .84rem; margin-left: auto; }
.ev-add:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.ev-hint { font-size: .84rem; margin-left: auto; }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 22px; }
.kpi { padding: 18px; border-right: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.kpi:last-child { border-right: 0; }
.kpi strong { font: 650 2rem/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi small { color: var(--muted); font-size: .84rem; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.dash-grid > section { margin: 0; min-width: 0; }
.pipe { display: flex; height: 34px; border-radius: var(--r); overflow: hidden; background: var(--sunk); }
.pipe span { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 12px; font-size: .86rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.c-draft { background: var(--line); } .c-submitted { background: var(--info); } .c-in_review { background: var(--warn); }
.c-approved { background: var(--ok); } .c-rejected { background: var(--bad); }
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: center; }
.bar-row > b { font: 700 .78rem/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; }
.bar-pair { display: grid; gap: 4px; }
.bar-line { display: grid; grid-template-columns: 38px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); }
.track { height: 12px; background: var(--sunk); border-radius: 3px; position: relative; overflow: hidden; }
.track > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.track .prep { background: var(--info); opacity: .75; }
.track .wrap { background: var(--accent); }
.bar-line .mono { color: var(--ink); text-align: right; }
.scale { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; font: .72rem var(--mono); color: var(--muted); }
.scale > div { display: flex; justify-content: space-between; margin: 0 52px 0 46px; }
.practice { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.practice:first-child { border-top: 0; padding-top: 0; }
.practice .track { grid-column: 1 / -1; height: 6px; }
.practice .mono { text-align: right; }
.export { display: flex; gap: 10px; flex-wrap: wrap; }
/* Activity & comments */
.activity { margin-top: 22px; scroll-margin-top: 16px; }
.replies { list-style: none; margin: 10px 0 0 4px; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
.tl-comment.internal .replies { border-left-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.thread-actions { display: flex; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; margin-top: 8px; }
.thread-actions:empty { display: none; }
.reply-box { display: grid; gap: 8px; margin-top: 10px; }
.reply-box textarea { width: 100%; resize: vertical; min-height: 3.2rem; }
.reply-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tl-comment.resolved { background: var(--bg); border-style: dashed !important; padding: 8px 14px !important; }
.tl-comment.resolved.internal { background: var(--bg); }
.tl-comment.resolved .tl-head { align-items: center; }
.resolved-mark { color: var(--ok); font-weight: 700; }
.tl-snippet { flex: 1 1 12rem; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.danger-zone { margin-top: 22px; border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.danger-zone .block-head h2 { color: var(--bad); }
.danger-zone .block-body { display: grid; gap: 12px; justify-items: start; }
.danger-zone p { margin: 0; max-width: 65ch; }
.danger-zone .field { width: min(100%, 26rem); }
.danger-zone .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
button.danger-outline { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: var(--surface); }
button.danger-fill:disabled { opacity: .5; }
#toActivity { white-space: nowrap; }
.activity .block-head { align-items: center; flex-wrap: wrap; }
.activity .seg button { border: 0; border-radius: 0; padding: 7px 12px; font-size: .84rem; }
.activity .seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.composer { display: grid; gap: 10px; margin-bottom: 18px; }
.composer textarea { width: 100%; resize: vertical; min-height: 4.5rem; }
.composer-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.seg.vis { border: 1px solid var(--line); padding: 0; margin: 0; }
.seg.vis label { position: relative; cursor: pointer; }
.seg.vis input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg.vis span { display: block; padding: 7px 12px; font-size: .86rem; font-weight: 600; }
.seg.vis small { display: block; font-weight: 400; color: var(--muted); font-size: .76rem; }
.seg.vis label + label span { border-left: 1px solid var(--line); }
.seg.vis input:checked + span { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.seg.vis input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.timeline > li { min-width: 0; }
.timeline > li { padding: 10px 0; border-top: 1px solid var(--line); }
.timeline > li:first-child { border-top: 0; }
.tl-event { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: .9rem; color: var(--muted); }
.tl-event b { color: var(--ink); font-weight: 600; }
.tl-ico { text-align: center; color: var(--accent); }
.timeline time { font: .78rem var(--mono); color: var(--muted); white-space: nowrap; }
.tl-comment { padding: 12px 14px !important; margin: 6px 0; border: 1px solid var(--line) !important; border-radius: var(--r); background: var(--surface); }
.tl-comment.internal { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)) !important; }
.tl-comment + li { border-top: 0; }
.tl-head { display: flex; gap: 8px 10px; align-items: baseline; flex-wrap: wrap; }
.tl-head time { margin-left: auto; }
.tl-body { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tag-internal { background: var(--warn); color: var(--surface); }
.tag-shared { background: var(--info-soft); color: var(--info); }
@media (max-width: 600px) { .tl-event { grid-template-columns: 1.4rem minmax(0, 1fr); } .tl-event time { grid-column: 2; } }
.page-head > .export { flex: 1 1 auto; justify-content: flex-end; }
.chart-block [data-astable] { white-space: nowrap; }
/* Dashboard layout (rearrangeable) */
.dboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
.dw { min-width: 0; position: relative; }
.dw.w-full { grid-column: 1 / -1; }
.dw > section.block, .dw > .kpis { margin: 0; }
.dboard.editing .dw { outline: 2px dashed var(--line); outline-offset: 6px; border-radius: var(--r); }
.dboard.editing .dw:hover { outline-color: var(--muted); }
.dw.dragging { opacity: .45; }
.dw.drop-before { box-shadow: -6px 0 0 -2px var(--accent); }
.dw.w-full.drop-before { box-shadow: 0 -8px 0 -4px var(--accent); }
.dw.drop-after { box-shadow: 6px 0 0 -2px var(--accent); }
.dw.w-full.drop-after { box-shadow: 0 8px 0 -4px var(--accent); }
.dw-tools { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 8px; background: var(--accent-soft); border-radius: var(--r); font-size: .86rem; cursor: grab; }
.dw-tools b { flex: 1 1 auto; min-width: 0; }
.dw-tools .link { font-size: .84rem; }
.dw-grip { font-size: 1.1rem; color: var(--muted); line-height: 1; }
.dash-editbar { padding: 12px 16px; margin-bottom: 22px; display: grid; gap: 8px; border-left: 4px solid var(--hl); }
.dash-editbar p { margin: 0; }
.dash-editbar-actions { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
/* Custom charts — categorical slots validated (CVD ≥ 14 adjacent, both themes); marigold and teal sit under 3:1, so every chart has tooltips and a table view */
.chart-block .block-head { align-items: flex-start; }
.chart-sub { margin: 4px 0 0; }
.chart { min-height: 60px; position: relative; }
.chart-svg { display: block; max-width: 100%; overflow: visible; }
.chart-svg .grid { stroke: var(--line); stroke-width: 1; }
.chart-svg .axis { stroke: var(--muted); stroke-width: 1; }
.chart-svg .tick, .donut .tick { fill: var(--muted); font: 11px var(--mono); }
.chart-svg .xlabel { fill: var(--muted); font: 12px var(--body); }
.chart-svg .vlabel { fill: var(--ink); font: 600 12px var(--mono); }
.chart-svg .mark, .donut .mark { stroke: var(--surface); stroke-width: 1; }
.chart-svg .mark:hover, .donut .mark:hover, .hbar .mark:hover { filter: brightness(1.1) saturate(1.1); }
.chart-svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .dot { stroke: var(--surface); stroke-width: 2; }
.chart-svg .hit { fill: transparent; }
.chart-svg .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-legend { margin: 0 0 10px; }
.chart-note { margin: 8px 0 0; }
.chart-empty { margin: 8px 0; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .86rem; }
.hlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htrack { display: flex; height: 16px; gap: 2px; }
.htrack.grouped { flex-direction: column; height: auto; gap: 2px; }
.htrack .mark { display: block; height: 16px; width: var(--w); min-width: 2px; border-radius: 0 4px 4px 0; flex: none; }
.htrack.grouped .mark { height: 9px; }
.htrack.stack .mark { border-radius: 0; }
.htrack.stack .mark:last-child { border-radius: 0 4px 4px 0; }
.htrack .empty { display: block; height: 9px; }
.hval { text-align: right; white-space: nowrap; min-width: 3.5rem; }
.donut { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.donut svg { flex: none; }
.dtotal { fill: var(--ink); font: 600 20px var(--mono); }
.dlegend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; flex: 1 1 12rem; min-width: 0; font-size: .88rem; }
.dlegend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 3rem; gap: 8px; align-items: center; }
.dlegend i { width: 10px; height: 10px; border-radius: 2px; }
.dlegend .muted { text-align: right; }
.bignum { display: grid; gap: 4px; padding: 6px 0; }
.bignum strong { font-size: clamp(2.2rem, 6vw, 3rem); line-height: 1; letter-spacing: -.02em; }
.ctable td, .ctable th { white-space: nowrap; }
#ctip { position: fixed; z-index: 60; display: none; pointer-events: none; max-width: 280px; padding: 8px 10px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: .82rem; line-height: 1.4; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
#ctip .muted { color: inherit; opacity: .75; }
#ctip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
/* Chart builder */
#chartDlg { width: min(1040px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
#chartDlg::backdrop { background: rgb(20 24 18 / .45); }
.builder { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100dvh - 26px); }
.builder-head, .builder-foot { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
.builder-head { justify-content: space-between; border-bottom: 1px solid var(--line); }
.builder-foot { justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }
.builder-foot .muted { margin-right: auto; }
.builder-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); overflow: auto; }
.builder-form { display: grid; gap: 14px; padding: 18px; align-content: start; border-right: 1px solid var(--line); }
.builder-preview { padding: 18px; display: grid; gap: 6px; align-content: start; background: var(--bg); position: sticky; top: 0; }
.builder-preview .pv-title { font-family: var(--display); font-weight: var(--hw); font-size: 1.25rem; text-transform: none; letter-spacing: 0; }
.builder-preview .chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-top: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tcard { position: relative; }
.tcard input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tcard span { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r); font-size: .88rem; font-weight: 500; }
.tcard input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.tcard input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.bfilters { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 12px; }
.bfilters summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.bfilters[open] summary { margin-bottom: 10px; }
.bfilters .field + .field { margin-top: 10px; }
.check-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.check-chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check-chip input { margin: 0; accent-color: var(--accent); }
.b-hint:empty { display: none; }
@media (max-width: 860px) {
  .dboard { grid-template-columns: minmax(0, 1fr); }
  .builder-body { grid-template-columns: minmax(0, 1fr); }
  .builder-form { border-right: 0; border-bottom: 1px solid var(--line); }
  .builder-preview { position: static; }
  .hbar { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr) auto; }
}
@media (max-width: 860px) {
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .bar-row, .scale { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .scale > span { display: none; }
}

/* Compare */
.practice a { color: var(--ink); text-decoration: none; }
.practice a:hover { color: var(--accent); text-decoration: underline; }
.cmp-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) auto minmax(0, 1fr); gap: 14px; padding: 16px 18px; margin-bottom: 14px; align-items: end; }
.cmp-title { font-size: 1.6rem; margin-bottom: 8px; }
.cmp-filters { margin-bottom: 26px; }
.fhead { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 12px 18px; }
.fhead .muted { margin-left: auto; font-size: .9rem; }
.fhead .muted b { color: var(--ink); }
.ftoggle { display: inline-flex; align-items: center; gap: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px 24px; padding: 16px 18px 18px; border-top: 1px solid var(--line); }
.facet { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.facet legend { padding: 0; margin-bottom: 8px; }
.facet .chips { gap: 6px; }
.facet small { font-size: .78rem; }
.fchip { padding: 6px 10px; font-size: .82rem; }
.fchip .cnt { font: 500 .72rem/1 var(--mono); color: var(--muted); margin-left: 2px; }
.fchip[aria-pressed="true"] .cnt { color: inherit; opacity: .75; }
.fchip:disabled { opacity: .4; cursor: default; }
.frange { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.frange input { padding: 7px 8px; font-size: .88rem; }
.fsummary { padding: 0 18px 14px; font-size: .86rem; }
.cmp-title .muted { display: block; font: 600 .78rem/1.6 var(--body); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
.cmp-verdict { font-size: 1.05rem; margin-bottom: 18px; max-width: 70ch; }
.cmp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 22px; }
.cmp-card { border-top: 4px solid var(--line); }
.cmp-card.yes { border-top-color: var(--accent); }
.cmp-card.no { border-top-color: var(--warn); }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; }
.cmp-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 16px; gap: 12px; padding: 12px 18px 16px; border-bottom: 1px solid var(--line); }
.cmp-stats div { display: grid; gap: 4px; align-content: start; }
.cmp-stats strong { font: 650 1.7rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.cmp-card.yes .cmp-stats strong { color: var(--accent); }
.cmp-card.no .cmp-stats strong { color: var(--warn); }
.cmp-stats small { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.cmp-list { list-style: none; margin: 0; padding: 8px 18px 14px; display: grid; }
.cmp-list li { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; flex-wrap: wrap; }
.cmp-list li:first-child { border-top: 0; }
.cmp-list a { font-weight: 600; color: var(--ink); text-decoration: none; }
.cmp-list a:hover { color: var(--accent); }
.cmp-list .pill { margin-left: auto; }
.impact td { vertical-align: middle; }
.impact tr.sel td, .matrix tr.sel td, .mtable tr.sel td { background: var(--accent-soft); }
.mtable tbody tr.row { cursor: pointer; }
.mtable tbody tr.row:hover td { background: var(--sunk); }
.duo { min-width: 200px; }
.duo-line { display: grid; grid-template-columns: 44px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: .8rem; }
.duo-line + .duo-line { margin-top: 4px; }
.duo-line .mono { text-align: right; }
.track .no { background: var(--warn); }
.duo-line .k { color: var(--muted); }
.cmp-stats .lead strong { font-size: 2.3rem; }
.co2-out { grid-column: span 2; }
.co2-out output { font-size: .92rem; padding: 6px 0; font-family: var(--body); display: flex; flex-wrap: wrap; gap: 4px 16px; }
@media (max-width: 760px) { .co2-out { grid-column: auto; } }
.co2-out output b { font-size: 1.15rem; color: var(--accent); }
.thresh { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 10px; align-items: center; min-height: 40px; }
.thresh input { padding: 0; accent-color: var(--accent); border: 0; background: none; }
.thresh output { font-weight: 600; text-align: right; }
.sample-note { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
.sample-note .tag { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.cmp-foot { margin: -8px 0 22px; font-size: .88rem; max-width: 80ch; }
.co2-chip { font-size: .8rem; color: var(--muted); }
b.good { color: var(--ok); } b.worse { color: var(--bad); }
td.ok-txt { color: var(--ok); } td.warn-txt { color: var(--warn); }
.matrix th { white-space: normal; min-width: 92px; vertical-align: bottom; text-transform: none; letter-spacing: 0; font-size: .82rem; }
.matrix th a { color: var(--ink); text-decoration: none; }
.matrix th:first-child, .matrix td:first-child { position: sticky; left: 0; background: var(--surface); min-width: 220px; z-index: 1; }
.matrix tr.sel td:first-child { background: var(--accent-soft); }
.matrix td { font-size: .86rem; }
.matrix .cell { text-align: center; font-weight: 600; color: var(--muted); }
.matrix .cell.y { color: var(--ok); background: var(--ok-soft); }
.matrix .cell.n { color: var(--bad); background: var(--bad-soft); }
.matrix tr.total td { font-weight: 700; border-top: 2px solid var(--line); text-align: center; }
@media (max-width: 860px) {
  .cmp-controls { grid-template-columns: minmax(0, 1fr); }
  .cmp-grid { grid-template-columns: minmax(0, 1fr); }
  .matrix th:first-child, .matrix td:first-child { min-width: 150px; }
}

.factor-row { grid-template-columns: minmax(0, 1.3fr) 110px minmax(0, 1.2fr) auto; }
/* Board */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 8px 14px; font-size: .86rem; color: var(--muted); background: none; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.board-scroll { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(var(--cols), minmax(186px, 1fr)); gap: 12px; min-width: calc(var(--cols) * 198px); }
.kcol { background: var(--sunk); border-radius: var(--r); display: flex; flex-direction: column; min-height: 320px; border: 2px solid transparent; transition: border-color .12s, background .12s; }
.kcol.over { border-color: var(--accent); background: var(--accent-soft); }
.khead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 10px; font: 700 .78rem/1 var(--body); letter-spacing: .08em; text-transform: uppercase; border-top: 4px solid var(--line); border-radius: var(--r) var(--r) 0 0; }
.khead b { font-size: .85rem; color: var(--muted); }
.c-top-submitted { border-top-color: var(--info); } .c-top-in_review { border-top-color: var(--warn); }
.c-top-approved { border-top-color: var(--ok); } .c-top-rejected { border-top-color: var(--bad); }
.kbody { display: grid; gap: 10px; padding: 0 10px 12px; align-content: start; flex: 1; }
.kempty { color: var(--muted); font-size: .85rem; text-align: center; padding: 22px 8px; border: 1px dashed var(--line); border-radius: var(--r); margin: 0; }
.kcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
.kcard[draggable="true"] { cursor: grab; }
.kcard:hover { border-color: var(--muted); }
.kcard.dragging { opacity: .45; }
.kname { font-weight: 700; color: var(--ink); text-decoration: none; line-height: 1.25; overflow-wrap: anywhere; }
.kname:hover { color: var(--accent); }
.kcard .sub { font-size: .8rem; color: var(--muted); margin-top: -4px; }
.kmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; }
.kmeta:empty { display: none; }
.kmeta .mono { color: var(--muted); }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .66rem/1 var(--body); background: var(--accent-soft); color: var(--accent); }
.ktag-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.kfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; font-size: .78rem; border-top: 1px solid var(--line); padding-top: 8px; }
.kstale { color: var(--warn); font-weight: 600; }
.kmove { position: relative; }
.kmove select { font-size: .76rem; padding: 3px 6px; width: auto; max-width: 112px; }
.board-hint { font-size: .85rem; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { .kcol { transition: none; } }

/* Notifications */
.bell-wrap { position: relative; }
.bell { position: relative; padding: 7px 9px; border-radius: 999px; color: var(--muted); }
.bell[aria-expanded="true"] { color: var(--ink); border-color: var(--muted); }
.bell-count { position: absolute; top: -5px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font: 700 .68rem/18px var(--body); text-align: center; }
.bell-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 36px rgb(0 0 0 / .16); }
.bell-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.bell-panel ul { list-style: none; margin: 0; padding: 0; }
.bell-panel li + li { border-top: 1px solid var(--line); }
.bell-panel a { display: flex; gap: 10px; align-items: baseline; padding: 11px 14px; color: var(--ink); text-decoration: none; font-size: .9rem; line-height: 1.35; }
.bell-panel a:hover { background: var(--sunk); }
.bell-panel li.unread a { background: var(--accent-soft); font-weight: 600; }
.bell-panel small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; margin-top: 2px; }
.bell-panel .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.bell-empty { padding: 18px 14px; color: var(--muted); font-size: .9rem; }
@media (max-width: 760px) {
  .bell-panel { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: calc(env(safe-area-inset-top, 0px) + 120px); }
}

/* PEACH form */
details.dept { border-top: 1px solid var(--line); }
details.dept:first-of-type { border-top: 0; }
details.dept > summary { list-style: none; cursor: pointer; }
details.dept > summary::-webkit-details-marker { display: none; }
details.dept > summary h3::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--muted); transition: transform .12s; }
details.dept[open] > summary h3::before { transform: rotate(90deg); }
.dept-sum { font-size: .8rem; color: var(--muted); text-align: right; }
.dept-sum.done { color: var(--ok); }
.dept-tools { display: flex; gap: 14px; flex-wrap: wrap; }
.q-text .eyebrow { display: block; }
.q-text p b { font-weight: 700; }
.q-text .doc { font-size: .84rem; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.q-text .doc .label { flex: none; }
.tag-innov { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.yn label.na:has(input:checked) { background: var(--sunk); color: var(--ink); }
.q-tier .q-ans { flex-direction: column; align-items: stretch; min-width: 230px; }
.tier { display: grid; gap: 4px; }

  sb.auth.onAuthStateChange((event, session) => {
    const changed = (session?.user?.id || null) !== (S.session?.user?.id || null);

async function start() {

  clearInterval(S.notePoll);

  $app.innerHTML = `<p class="loading">Loading your workspace…</p>`;
  try {
    const uid = S.session.user.id;

  start.addEventListener("click", () => {
    const body = document.getElementById("delBody");

          const paths = [];

            if (f.id) { paths.push(`${pid}/${f.name}`); continue; }
            const sub = await ev.list(`${pid}/${f.name}`, { limit: 1000 });

          if (paths.length) await ev.remove(paths);

        const { data, error } = await sb.from("productions").delete().eq("production_id", pid).select("production_id");
        if (error) throw error;
        if (!data?.length) throw new Error("This application can't be deleted any more. Submitted applications can only be deleted by EMA staff.");
        toast(`${name || "Application"} deleted`);

    });
  });
}

      if (!S.activity.comments.some((x) => x.comment_id === data.comment_id)) S.activity.comments.push(data);
      parent.resolved_at = null; parent.resolved_by = null; // replying reopens the conversation
      S.replyOpen.delete(tid); delete S.replyDrafts[tid]; drawTimeline(); toast("Reply posted");
      return;
    }
    if (b.hasAttribute("data-resolve")) {
      const c = row(tid), resolving = !c.resolved_at;
      const { data, error } = await sb.from("application_comments").update({ resolved_at: resolving ? new Date().toISOString() : null }).eq("comment_id", tid).select().single();
      if (error) return fail(error);
      Object.assign(c, { resolved_at: data?.resolved_at ?? (resolving ? new Date().toISOString() : null), resolved_by: data?.resolved_by ?? (resolving ? S.me.id : null) });
      S.openThreads.delete(tid); drawTimeline(); toast(resolving ? "Conversation resolved" : "Conversation reopened");
      return;
    }
    if (b.hasAttribute("data-delc")) {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = li.closest(".replies") ? "Confirm remove?" : "Remove the whole conversation?"; return; }
      const id = +li.dataset.cid;
      const { error } = await sb.from("application_comments").delete().eq("comment_id", id);
      if (error) return fail(error);
      S.activity.comments = S.activity.comments.filter((x) => x.comment_id !== id && x.parent_id !== id); drawTimeline(); toast("Removed");
    }
  });
}

function wireActivity(app) {
  const pid = app.production_id;
  wireTimeline(pid);
  wireDelete(app);
  document.getElementById("toActivity")?.addEventListener("click", () => { const s = document.getElementById("activity"); s.scrollIntoView({ behavior: "smooth", block: "start" }); document.getElementById("cm-body")?.focus({ preventScroll: true }); });
  document.querySelectorAll("[data-actf]").forEach((b) => b.addEventListener("click", () => {
    S.actFilter = b.dataset.actf; document.querySelectorAll("[data-actf]").forEach((x) => x.setAttribute("aria-pressed", x === b)); drawTimeline();
  }));
  document.querySelectorAll("input[name=cm-vis]").forEach((r) => r.addEventListener("change", () => (S.cmVis = r.value)));
  document.getElementById("composer")?.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const ta = document.getElementById("cm-body"), body = ta.value.trim();
    if (!body) { ta.focus(); return toast("Write something first.", "bad"); }
    const internal = isReviewerish() ? document.querySelector("input[name=cm-vis]:checked")?.value !== "shared" : false;
    const btn = ev.currentTarget.querySelector("button[type=submit]"); btn.disabled = true;
    const { data, error } = await sb.from("application_comments").insert({ production_id: pid, author: S.me.id, body, internal }).select().single();
    btn.disabled = false;
    if (error) return fail(error);
    if (!S.activity.comments.some((x) => x.comment_id === data.comment_id)) S.activity.comments.unshift(data);
    ta.value = ""; drawTimeline(); toast(internal ? "Internal note posted" : "Comment posted");
  });
  // Live: new comments from others appear without reloading.
  if (S.actChannel) sb.removeChannel(S.actChannel);
  S.actChannel = sb.channel("comments-" + pid)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "application_comments", filter: `production_id=eq.${pid}` }, (p) => {
      if (S.activity?.pid !== pid || S.activity.comments.some((x) => x.comment_id === p.new.comment_id)) return;
      S.activity.comments.unshift(p.new); drawTimeline();
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "application_comments", filter: `production_id=eq.${pid}` }, (p) => {
      const c = S.activity?.pid === pid && S.activity.comments.find((x) => x.comment_id === p.new.comment_id);
      if (c) { Object.assign(c, p.new); drawTimeline(); }
    }).subscribe();
}

// ── Notifications bell ─────────────────────────────────────────────────────
// Rows are created by a database trigger whenever an application's status or
// reviewer changes; this shows them live (realtime) with a 60-second fallback poll.
const since = (iso) => {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : ago(Math.floor(m / 1440));
};
async function loadNotes() {
  const { data, error } = await sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(30);
  if (!error) { S.notes = data; drawBell(); }
}
function subscribeNotes() {
  if (!S.me) return;
  S.noteChannel = sb.channel("notes-" + S.me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${S.me.id}` }, (payload) => {
      if (S.notes.some((n) => n.id === payload.new.id)) return;
      S.notes.unshift(payload.new); drawBell(); toast(payload.new.message);
    })
    .subscribe();
  S.notePoll = setInterval(loadNotes, 60000);
}
function drawBell() {
  const el = document.getElementById("bell"); if (!el) return;
  const unread = S.notes.filter((n) => !n.read_at).length;
  el.innerHTML = `
    <button class="bell" id="bellBtn" aria-haspopup="true" aria-expanded="${!!S.bellOpen}" aria-label="Notifications${unread ? `, ${unread} unread` : ""}">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      ${unread ? `<span class="bell-count">${unread > 9 ? "9+" : unread}</span>` : ""}
    </button>
    ${S.bellOpen ? `<div class="bell-panel" role="dialog" aria-label="Notifications">
      <div class="bell-head"><b>Notifications</b>${unread ? `<button class="link" id="readAll">Mark all read</button>` : ""}</div>
      <ul>${S.notes.map((n) => `<li class="${n.read_at ? "" : "unread"}"><a href="${n.production_id ? "#app-" + n.production_id : "#"}" data-note="${n.id}">
        ${n.status ? `<i class="dot c-${esc(n.status)}"></i>` : ""}<span>${esc(n.message)}<small>${esc(since(n.created_at))}</small></span></a></li>`).join("")
        || `<li class="bell-empty">You're all caught up. Status changes on your applications will show up here.</li>`}</ul>
    </div>` : ""}`;
  document.getElementById("bellBtn").addEventListener("click", (e) => { e.stopPropagation(); S.bellOpen = !S.bellOpen; drawBell(); });
  document.getElementById("readAll")?.addEventListener("click", async (e) => {
    e.stopPropagation();
    const now = new Date().toISOString(); S.notes.forEach((n) => (n.read_at ||= now)); drawBell();
    await sb.from("notifications").update({ read_at: now }).is("read_at", null);
  });
  el.querySelectorAll("[data-note]").forEach((a) => a.addEventListener("click", () => {
    const n = S.notes.find((x) => x.id === +a.dataset.note); S.bellOpen = false;
    if (n && !n.read_at) { n.read_at = new Date().toISOString(); sb.from("notifications").update({ read_at: n.read_at }).eq("id", n.id).then(() => {}); }
    drawBell();
  }));
}
document.addEventListener("click", (e) => { if (S.bellOpen && !e.target.closest(".bell-panel")) { S.bellOpen = false; drawBell(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.bellOpen) { S.bellOpen = false; drawBell(); document.getElementById("bellBtn")?.focus(); } });

// ── Board (kanban) ─────────────────────────────────────────────────────────
// Reviewers and staff drag cards between stages (or use the Stage menu on a
// card). Final decisions ask for confirmation, because the submitter is emailed.
const daysSince = (d) => (d ? Math.floor((Date.now() - new Date(d + (d.length === 10 ? "T12:00:00" : "")).getTime()) / 86400000) : null);
const ago = (n) => (n == null ? "" : n <= 0 ? "today" : n === 1 ? "1 day ago" : `${n} days ago`);
const initials = (name) => (name || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
function boardColumns() { return role() === "reviewer" ? ["submitted", "in_review", "approved", "rejected"] : ["draft", "submitted", "in_review", "approved", "rejected"]; }
function canMoveCards() { return isReviewerish(); }

function drawBoard() {
  const q = S.search.trim().toLowerCase();
  const apps = S.apps.filter((a) => (S.filter !== "mine" || a.assigned_reviewer === S.me.id) &&
    (!q || [a.production_name, a.studio_affiliation, a.production_type].some((v) => (v || "").toLowerCase().includes(q))));
  const cols = boardColumns(), move = canMoveCards(), tot = possible();
  const el = document.getElementById("rows");
  const card = (a) => {
    const s = S.scores[a.production_id], rev = personName(a.assigned_reviewer), perDay = tonnesPerDay(a);
    const waiting = a.status === "submitted" ? daysSince(a.submission_date) : null;
    return `<article class="kcard" data-id="${a.production_id}" ${move ? 'draggable="true"' : ""}>
      <a class="kname" href="#app-${a.production_id}">${esc(a.production_name)}</a>
      <div class="sub">${esc([a.production_type, a.production_sub_type].filter(Boolean).join(" · ")) || "&nbsp;"}</div>
      <div class="kmeta">
        ${isReviewerish() && a.status !== "draft" ? (rev ? `<span class="avatar" title="Reviewer: ${esc(rev)}">${esc(initials(rev))}</span>` : `<span class="tag ktag-warn">Unassigned</span>`) : ""}
        ${s?.wrap?.answered ? `<span class="mono" title="Self-assessed PEACH score at wrap">${Math.round(s.wrap.pct ?? 0)}%</span>` : s?.prep?.answered ? `<span class="mono muted" title="Self-assessed PEACH score at prep">Prep ${Math.round(s.prep.pct ?? 0)}%</span>` : ""}
        ${perDay != null ? `<span class="mono" title="Tonnes CO₂ per shoot day">${t1(perDay)} t/day</span>` : ""}
      </div>
      <div class="kfoot">
        <span class="${waiting != null && waiting > 7 ? "kstale" : "muted"}">${waiting != null ? `Waiting ${waiting} day${waiting === 1 ? "" : "s"}` : `Updated ${ago(daysSince(a.updated_at))}`}</span>
        ${move ? `<label class="kmove"><span class="sr">Move ${esc(a.production_name)} to</span><select data-move="${a.production_id}">${cols.map((c) => `<option value="${c}" ${a.status === c ? "selected" : ""}>${STATUS[c]}</option>`).join("")}</select></label>` : ""}
      </div>
    </article>`;
  };
  el.innerHTML = `<div class="board-scroll"><div class="board" style="--cols:${cols.length}">${cols.map((c) => {
    const list = apps.filter((a) => a.status === c);
    return `<section class="kcol" data-col="${c}" aria-label="${STATUS[c]}">
      <header class="khead c-top-${c}"><span>${STATUS[c]}</span><b class="mono">${list.length}</b></header>
      <div class="kbody" data-drop="${c}">${list.map(card).join("") || `<p class="kempty">${move ? "Drag applications here" : "Nothing here"}</p>`}</div>
    </section>`;
  }).join("")}</div></div>
  ${move ? `<p class="muted board-hint">Drag a card to change its stage, or use the menu on the card. Approving or rejecting emails the submitter.</p>` : ""}`;

  el.querySelectorAll(".kcard").forEach((c) => c.addEventListener("click", (e) => { if (!e.target.closest("a,select,label")) location.hash = "app-" + c.dataset.id; }));
  el.querySelectorAll("[data-move]").forEach((sel) => sel.addEventListener("change", () => requestMove(+sel.dataset.move, sel.value)));
  if (!move) return;
  let dragId = null;
  el.querySelectorAll(".kcard").forEach((c) => {
    c.addEventListener("dragstart", (e) => { dragId = +c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", c.dataset.id); });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); el.querySelectorAll(".kcol").forEach((k) => k.classList.remove("over")); });
  });
  el.querySelectorAll(".kcol").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("over"); });
    col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("over"); const id = dragId ?? +e.dataTransfer.getData("text/plain"); dragId = null; if (id) requestMove(id, col.dataset.col); });
  });
}

function requestMove(id, to) {
  const a = S.apps.find((x) => x.production_id === id);
  if (!a || a.status === to) return;
  if (to === "approved" || to === "rejected") {
    const verb = to === "approved" ? "Approve" : "Reject";
    $actions.innerHTML = `<div class="actions"><div class="wrap"><div class="confirm">
      <span>${verb} <b>${esc(a.production_name)}</b>? The submitter will be emailed the decision.</span>
      <button class="primary" id="mvYes">${verb}</button><button id="mvNo">Cancel</button></div></div></div>`;
    document.getElementById("mvYes").addEventListener("click", () => { $actions.innerHTML = ""; applyMove(a, to); });
    document.getElementById("mvNo").addEventListener("click", () => { $actions.innerHTML = ""; drawBoard(); });
    return;
  }
  applyMove(a, to);
}

async function applyMove(a, to) {
  const before = { status: a.status, assigned_reviewer: a.assigned_reviewer, updated_at: a.updated_at, submission_date: a.submission_date };
  const patch = { status: to };
  const claim = to === "in_review" && !a.assigned_reviewer;   // taking it into review assigns it to you
  if (claim) patch.assigned_reviewer = S.me.id;
  Object.assign(a, patch, { updated_at: new Date().toISOString() });
  if (to === "submitted" && !a.submission_date) a.submission_date = new Date().toISOString().slice(0, 10);
  drawBoard();
  const { error } = await sb.from("productions").update(patch).eq("production_id", a.production_id);
  if (error) { Object.assign(a, before); drawBoard(); return fail(error); }
  toast(`${a.production_name} moved to ${STATUS[to]}${claim ? " and assigned to you" : ""}`);
  if (to !== "submitted" || before.status === "draft") sb.functions.invoke("notify", { body: { production_id: a.production_id } }).catch((e) => console.warn("Notification not sent", e));
}

async function openApp(id) {
  renderBar();
  let app, resp = [];
  if (id == null) {
    app = { production_id: null, status: "draft", submitted_by: S.me.id };
    S.deptAnswerers = {}; await loadContacts();
  } else {
    $app.innerHTML = `<p class="loading">Loading application…</p>`;
    const [a, r, da] = await Promise.all([
      sb.from("productions").select("*").eq("production_id", id).maybeSingle(),
      sb.from("responses").select("*").eq("production_id", id),
      sb.from("department_answerers").select("department_id,contact_id").eq("production_id", id),
      loadContacts(),
    ]);
    S.deptAnswerers = Object.fromEntries((da.data || []).map((x) => [x.department_id, x.contact_id]));
    if (a.error || r.error) { const e = a.error || r.error; fail(e); $app.innerHTML = notice("Couldn't load this application", friendly(e)); return; }
    if (!a.data) { $app.innerHTML = notice("Application not found", "It may have been removed, or you don't have access to it.", `<a class="btn" href="#applications">Back to applications</a>`); return; }
    app = a.data; resp = r.data;
  }
  S.current = { app, resp: Object.fromEntries(resp.map((x) => [x.question_id, x])), confirm: false };
  if (S.openFor !== id) { S.openFor = id; S.openDepts = new Set(S.depts.slice(0, 1).map((d) => d.department_id)); }
  drawApp();
}

function perms(app) {
  const own = app.submitted_by === S.me.id, staff = isStaff(), draft = app.status === "draft";
  return {
    own, draft,
    details: staff || (own && draft),
    answers: staff || (own && draft),
    score: staff || (role() === "reviewer" && !draft),
    submit: own && draft,
    del: staff || (own && draft),
  };
}

// ── Evidence files ─────────────────────────────────────────────────────────
const BUCKET = "evidence";
const evName = (n) => n.replace(/^\d{10,}-/, "");
async function loadEvidence(onlyQid) {
  const { app } = S.current; const pid = app.production_id; const P = perms(app);
  let qids = onlyQid ? [onlyQid] : null;
  if (!qids) {
    // One listing of the application's folder tells us which questions have files.
    document.querySelectorAll("ul.files").forEach((ul) => (ul.innerHTML = `<li class="muted">${P.answers ? "No files yet" : "None attached"}</li>`));
    const { data, error } = await sb.storage.from(BUCKET).list(`${pid}`, { limit: 1000 });
    if (error) return;
    qids = (data || []).filter((f) => !f.id && /^\d+$/.test(f.name)).map((f) => +f.name);
  }
  await Promise.all(qids.map(async (qid) => {
    const ul = document.getElementById("files-" + qid); if (!ul) return;
    const { data, error } = await sb.storage.from(BUCKET).list(`${pid}/${qid}`, { limit: 100, sortBy: { column: "created_at", order: "asc" } });
    if (error) { ul.innerHTML = `<li class="muted">Couldn't load files</li>`; return; }
    const files = (data || []).filter((f) => f.id && !f.name.startsWith("."));
    ul.innerHTML = files.length
      ? files.map((f) => `<li><button type="button" class="link" data-view="${esc(`${pid}/${qid}/${f.name}`)}">${esc(evName(f.name))}</button>
          <span class="muted mono">${f.metadata?.size ? Math.max(1, Math.round(f.metadata.size / 1024)) + " KB" : ""}</span>
          ${P.answers ? `<button type="button" class="link danger" data-del="${esc(`${pid}/${qid}/${f.name}`)}" aria-label="Remove ${esc(evName(f.name))}">Remove</button>` : ""}</li>`).join("")
      : `<li class="muted">${P.answers ? "No files yet" : "None attached"}</li>`;
    ul.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => viewEvidence(b.dataset.view)));
    ul.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
      const { error } = await sb.storage.from(BUCKET).remove([b.dataset.del]);
      if (error) return fail(error); toast("File removed"); loadEvidence(qid);
    }));
  }));
}

async function uploadEvidence(qid, input) {
  const pid = S.current.app.production_id; const files = [...input.files]; input.value = "";
  if (!files.length) return;
  const tooBig = files.find((f) => f.size > 10 * 1024 * 1024);
  if (tooBig) return toast(`${tooBig.name} is over the 10 MB limit.`, "bad");
  const ul = document.getElementById("files-" + qid); ul.insertAdjacentHTML("beforeend", `<li class="muted">Uploading ${files.length} file${files.length > 1 ? "s" : ""}…</li>`);
  let ok = 0;
  for (const f of files) {
    const safe = f.name.normalize("NFKD").replace(/[^\w.\- ]+/g, "").replace(/\s+/g, "_").slice(-80) || "file";
    const { error } = await sb.storage.from(BUCKET).upload(`${pid}/${qid}/${Date.now()}-${safe}`, f, { contentType: f.type || undefined, upsert: false });
    if (error) { fail(/mime|type/i.test(error.message) ? new Error(`${f.name}: use a photo, PDF, Word, Excel or CSV file.`) : error); break; }
    ok++;
  }
  if (ok) toast(ok === 1 ? "File attached" : `${ok} files attached`);
  loadEvidence(qid);
}
async function viewEvidence(path) {
  const w = window.open("", "_blank");
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 300);
  if (error) { w?.close(); return fail(error); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

function question(q, r, P, showEarned) {
  const id = q.question_id, pts = +q.points_possible || 0, dis = P.answers ? "" : "disabled";
  const raw = q.question_text.replace(/^\[Innovation\]\s*/i, "");
  const m = raw.match(/^([^:]{2,70}):\s*([\s\S]*)$/);
  const title = m ? m[1] : null, body = m ? m[2] : raw;
  const same = (a, b) => a != null && b != null && String(a).toLowerCase() === String(b).toLowerCase();
  const ctl = (stage, val) => {
    const name = `${stage.toLowerCase()}-${id}`;
    if (isYesNo(q)) return `<fieldset class="yn"><legend class="label">${stage}</legend><div class="opts">${optsOf(q).map((o) =>
      `<label class="${o.na ? "na" : ""}"><input type="radio" name="${name}" value="${esc(o.label)}" ${same(val, o.label) ? "checked" : ""} ${dis}>${esc(o.label)}</label>`).join("")}</div></fieldset>`;
    return `<label class="tier"><span class="label">${stage}</span><select name="${name}" id="${name}" ${dis}><option value="">Choose one</option>${optsOf(q).map((o) =>
      `<option value="${esc(o.label)}" ${same(val, o.label) ? "selected" : ""}>${esc(o.label)}${o.na ? "" : ` (${fmt(o.points)} pt${+o.points === 1 ? "" : "s"})`}</option>`).join("")}</select></label>`;
  };
  const tags = [q.code, q.is_innovation ? `+${fmt(pts)} bonus` : `${fmt(pts)} pts`, q.category].filter(Boolean);
  const deptAns = contactById(S.deptAnswerers?.[q.department_id]), own = contactById(r.answered_by);
  return `<div class="q ${isYesNo(q) ? "" : "q-tier"}" data-q="${id}" data-dept="${q.department_id}">
    <div class="q-text">
      ${q.parent_label ? `<span class="eyebrow">${esc(q.parent_label)}</span>` : ""}
      <p>${title ? `<b>${esc(title)}.</b> ` : ""}${esc(body)}</p>
      <div class="tags">${q.is_innovation ? '<span class="tag tag-innov">Innovation</span>' : ""}${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      ${q.documentation ? `<p class="doc"><span class="label">Evidence</span> ${esc(q.documentation)}</p>` : ""}
    </div>
    <div class="q-ans">${ctl("Prep", r.prep_answer)}${ctl("Wrap", r.wrap_answer)}</div>
    <div class="q-wide">
      <div class="expl-row">
        <label class="field"><span>Evidence or explanation</span><textarea name="expl-${id}" id="expl-${id}" rows="2" placeholder="${P.answers ? "What was done, by whom, and any supporting detail" : ""}" ${dis}>${esc(r.explanation)}</textarea></label>
        ${P.answers ? `<label class="field ans-by"><span>Answered by</span><input name="aby-${id}" id="aby-${id}" list="contact-names" value="${esc(own?.full_name)}" placeholder="Same as department${deptAns ? ` (${esc(deptAns.full_name)})` : ""}" autocomplete="off"></label>`
          : `<div class="field ans-by"><span>Answered by</span><p class="ans-by-val">${own ? esc(own.full_name) : deptAns ? `${esc(deptAns.full_name)} <span class="muted">(department)</span>` : '<span class="muted">Not recorded</span>'}</p></div>`}
      </div>
      <div class="evidence" data-ev="${id}">
        <span class="label">Files</span>
        <ul class="files" id="files-${id}"><li class="muted">${S.current.app.production_id == null ? "" : "Loading…"}</li></ul>
        ${P.answers ? (S.current.app.production_id == null
          ? `<span class="muted ev-hint">Save the draft to attach photos or documents.</span>`
          : `<label class="btn ev-add">Attach files<input type="file" class="sr" id="up-${id}" data-up="${id}" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv"></label>`) : ""}
      </div>
      ${P.score ? `<div class="q-score">
          <label class="field"><span>Verified prep pts</span><input type="number" name="pp-${id}" id="pp-${id}" min="0" max="${pts}" step="0.5" inputmode="decimal" value="${r.prep_points ?? ""}"></label>
          <label class="field"><span>Verified wrap pts</span><input type="number" name="wp-${id}" id="wp-${id}" min="0" max="${pts}" step="0.5" inputmode="decimal" value="${r.wrap_points ?? ""}"></label>
          <label class="field note"><span>Reviewer note</span><input name="note-${id}" id="note-${id}" value="${esc(r.reviewer_notes)}"></label>
        </div>` : showEarned ? `<div class="earned"><span>Verified prep <b>${fmt(r.prep_points)}</b> / ${fmt(pts)}</span><span>Verified wrap <b>${fmt(r.wrap_points)}</b> / ${fmt(pts)}</span>${r.reviewer_notes ? `<span>Reviewer note: ${esc(r.reviewer_notes)}</span>` : ""}</div>` : ""}
    </div>
  </div>`;
}

function readForm() {
  const fd = new FormData(document.getElementById("appForm"));
  // Disabled inputs aren't in FormData, so read answers straight from the controls.
  const checked = (name) => {
    const el = document.querySelector(`[name="${name}"]`);
    if (!el) return null;
    if (el.tagName === "SELECT") return el.value || null;
    return document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  };
  return { fd, checked };
}

function updateTally() {
  const { resp, app } = S.current; const P = perms(app); const { fd, checked } = readForm();
  const prep = {}, wrap = {}; let verified = 0, vAny = false;
  for (const q of S.qs) {
    const id = q.question_id, a = checked("prep-" + id), b = checked("wrap-" + id);
    if (a) prep[id] = a; if (b) wrap[id] = b;
    const wp = P.score ? num(fd.get("wp-" + id)) : num(resp[id]?.wrap_points);
    if (wp != null && !q.is_innovation) { verified += wp; vAny = true; }
  }
  const Pp = peachScore(prep), W = peachScore(wrap), n = S.qs.length;
  const cell = (label, sc) => `<div><span class="label">${label}</span>
    <strong>${sc.answered ? Math.round(sc.pct ?? 0) + "%" : "–"}</strong>
    <small class="tsub">${fmt(sc.earned)} of ${fmt(sc.available)} pts · ${sc.answered}/${n} answered${sc.na ? ` · ${sc.na} N/A` : ""}</small></div>`;
  document.getElementById("tally").innerHTML = `
    ${cell("Prep score", Pp)}${cell("Wrap score", W)}
    <div><span class="label">Innovation bonus</span><strong>${fmt(W.answered ? W.bonus : Pp.bonus)}<small> / ${fmt(bonusPossible())}</small></strong><small class="tsub">${W.answered ? "at wrap" : "at prep"}</small></div>
    <div><span class="label">Reviewer verified</span><strong>${vAny ? fmt(verified) : "–"}<small> / ${fmt(W.available || possible())}</small></strong><small class="tsub">wrap points</small></div>`;
  for (const d of S.depts) {
    const el = document.getElementById("dsum-" + d.department_id); if (!el) continue;
    const qs = S.qs.filter((q) => q.department_id === d.department_id);
    const dp = peachScore(prep, qs), dw = peachScore(wrap, qs), stage = dw.answered ? dw : dp;
    el.textContent = `${dp.answered}/${qs.length} prep · ${dw.answered}/${qs.length} wrap · ${fmt(stage.earned)}/${fmt(stage.available)} pts`;
    el.classList.toggle("done", dw.answered === qs.length);
  }
  return { prepAns: Pp.answered, wrapAns: W.answered, n };
}

function autofill() {
  const { checked } = readForm();
  for (const q of S.qs) {
    const id = q.question_id;
    for (const [stage, field] of [["prep", "pp"], ["wrap", "wp"]]) {
      const a = checked(`${stage}-${id}`), el = document.getElementById(`${field}-${id}`);
      if (el && a) el.value = ansState(q, a) === "na" ? "" : ansPts(q, a) ?? "";
    }
  }
  updateTally(); toast("Points filled from the PEACH answers. Adjust any you can't verify, then save.");
}

function drawActions() {
  const { app, confirm } = S.current; const P = perms(app);
  if (!P.details && !P.answers && !P.score) { $actions.innerHTML = ""; return; }
  let hint = "";
  if (P.submit && !confirm) hint = "Drafts are only visible to you and staff.";
  else if (!P.answers && P.score) hint = "Answers are locked. You're scoring.";
  let body;
  if (confirm) {
    const { prepAns, wrapAns, n } = updateTally();
    const gaps = [n - prepAns ? `${n - prepAns} prep` : "", n - wrapAns ? `${n - wrapAns} wrap` : ""].filter(Boolean).join(" and ");
    body = `<div class="confirm"><span>${gaps ? `${esc(gaps)} answers are still blank. ` : ""}After you submit, you can't edit this application.</span>
      <button class="primary" id="doSubmit">Submit application</button><button id="cancelSubmit">Keep editing</button></div>`;
  } else {
    body = `${hint ? `<span class="hint">${esc(hint)}</span>` : ""}

  }

  document.getElementById("cancelSubmit")?.addEventListener("click", () => { S.current.confirm = false; drawActions(); });

async function saveApp({ submit = false } = {}) {
  setTimeout(() => S.current?.app?.production_id && loadActivity(S.current.app.production_id), 1200);
  let { app } = S.current; const P = perms(app); const { fd, checked } = readForm();
  let id = app.production_id;
  setBusy(true);
  try {
    if (P.details) {
      const det = {};
      for (const [k] of DETAILS) det[k] = String(fd.get(k) || "").trim() || null;
      for (const [k, label] of FOOTPRINT) {
        const v = num(fd.get(k));
        if (v != null && (isNaN(v) || v < 0 || (k === "shoot_days" && (v < 1 || !Number.isInteger(v))))) throw new Error(`${label} must be ${k === "shoot_days" ? "a whole number of days" : "zero or more"}.`);
        det[k] = v;
      }
      if (FOOTPRINT.some(([k]) => (app[k] ?? null) !== det[k])) det.footprint_is_sample = false;
      if (!det.production_name) { document.getElementById("d-production_name").focus(); throw new Error("Add the production name before saving."); }
      if (id == null) {
        const { data, error } = await sb.from("productions").insert({ ...det, submitted_by: S.me.id, status: "draft" }).select().single();
        if (error) throw error; id = data.production_id;
      } else {
        const { error } = await sb.from("productions").update(det).eq("production_id", id);
        if (error) throw error;
      }
      if (det.studio_affiliation) await ensureCompany(det.studio_affiliation, "studio");
    }
    // Who answered: department level, then per-answer overrides.
    const byQ = {};
    if (P.answers) {
      for (const d of S.depts) {
        const nameEl = document.getElementById("dans-" + d.department_id); if (!nameEl) continue;
        const name = nameEl.value.trim(), title = (document.getElementById("dtitle-" + d.department_id)?.value || "").trim();
        if (name) {
          const cid = await ensureContact(name, title, d.department_id);
          if (S.deptAnswerers[d.department_id] !== cid) {
            const { error } = await sb.from("department_answerers").upsert({ production_id: id, department_id: d.department_id, contact_id: cid }, { onConflict: "production_id,department_id" });
            if (error) throw error;
          }
        } else if (S.deptAnswerers[d.department_id]) {
          const { error } = await sb.from("department_answerers").delete().eq("production_id", id).eq("department_id", d.department_id);
          if (error) throw error;
        }
      }
      for (const q of S.qs) {
        const v = (document.getElementById("aby-" + q.question_id)?.value || "").trim();
        byQ[q.question_id] = v ? await ensureContact(v, null, q.department_id) : null;
      }
    }
    const rows = [];
    for (const q of S.qs) {
      const qid = q.question_id, prev = S.current.resp[qid];
      const row = { production_id: id, question_id: qid }; let any = !!prev;
      if (P.answers) {
        row.prep_answer = checked("prep-" + qid); row.wrap_answer = checked("wrap-" + qid);
        row.explanation = String(fd.get("expl-" + qid) || "").trim() || null;
        row.answered_by = byQ[qid] ?? null;
        any ||= !!(row.prep_answer || row.wrap_answer || row.explanation || row.answered_by);
      }
      if (P.score) {
        row.prep_points = num(fd.get("pp-" + qid)); row.wrap_points = num(fd.get("wp-" + qid));
        row.reviewer_notes = String(fd.get("note-" + qid) || "").trim() || null;
        for (const v of [row.prep_points, row.wrap_points]) {
          if (v != null && (isNaN(v) || v < 0 || v > (+q.points_possible || 0))) throw new Error(`Points for "${q.question_text}" must be between 0 and ${fmt(q.points_possible)}.`);
        }
        any ||= row.prep_points != null || row.wrap_points != null || !!row.reviewer_notes;
      }
      if (any) rows.push(row);
    }
    if (rows.length) {
      const { error } = await sb.from("responses").upsert(rows, { onConflict: "production_id,question_id" });
      if (error) throw error;
    }
    const st = document.getElementById("rv-status"), as = document.getElementById("rv-assign");
    if (P.score && st) {
      const { error } = await sb.from("productions").update({ status: st.value, assigned_reviewer: as.value || null }).eq("production_id", id);
      if (error) throw error;
    }
    if (submit) {
      const { error } = await sb.from("productions").update({ status: "submitted" }).eq("production_id", id);
      if (error) throw error;
    }
    // Email whoever needs to know about a status change. Never blocks saving.
    const newStatus = submit ? "submitted" : st?.value;
    if (newStatus && newStatus !== app.status && !(newStatus === "submitted" && app.status !== "draft")) {
      sb.functions.invoke("notify", { body: { production_id: id } }).catch((e) => console.warn("Notification not sent", e));
    }
    toast(submit ? "Application submitted" : "Saved");
    if (location.hash !== "#app-" + id) location.hash = "app-" + id; else openApp(id);
  } catch (e) { fail(e); } finally { setBusy(false); }
}

// ── Compare: compliant vs. non-compliant productions ───────────────────────
// "Practice score" = share of available points on Yes answers, computed from
// answers so it works for unscored applications too. Comparing on a single

// Emissions are compared per shoot day, so a 4-day commercial and a 70-day

const regionOf = (loc) => { const parts = (loc || "").split(",").map((x) => x.trim()).filter(Boolean); return parts.length > 1 ? parts[parts.length - 1] : parts[0] || "Not set"; };

const activeQs = () => (S.cmpF.depts.length ? S.qs.filter((q) => S.cmpF.depts.includes(q.department_id)) : S.qs);
function practiceScore(appId, stage, excludeQ, qs = activeQs()) {
  const a = S.cmpData.ans[appId] || {}, answers = {};
  for (const [qid, v] of Object.entries(a)) if (v[stage]) answers[qid] = v[stage];
  const sc = peachScore(answers, qs.filter((q) => q.question_id !== excludeQ));
  return sc.answered ? sc.pct : null;

const avg = (xs) => (xs.length ? xs.reduce((t, v) => t + v, 0) / xs.length : null);
function groupStats(list, stage, q) {
  const dec = list.filter((a) => a.status === "approved" || a.status === "rejected");
  const s = avg(list.map((a) => practiceScore(a.production_id, stage, q)).filter((v) => v != null));
  const metrics = {};
  for (const m of METRICS) { const vals = list.map(m.get).filter((v) => v != null); metrics[m.key] = { v: avg(vals), n: vals.length }; }

const pctDiff = (a, b) => (a != null && b ? Math.round(((a - b) / b) * 100) : null);

// A production passes when it matches every active filter (optionally ignoring one facet, for chip counts).
function passesFilters(a, exceptKey) {
  const F = S.cmpF;
  for (const f of CMP_FACETS) {
    if (f.key === exceptKey) continue;
    const sel = F.sel[f.key];
    if (sel.length && !sel.includes(f.get(a))) return false;
  }
  if (F.from && (!a.submission_date || a.submission_date < F.from)) return false;
  if (F.to && (!a.submission_date || a.submission_date > F.to)) return false;
  if (F.dmin !== "" && !(a.shoot_days >= +F.dmin)) return false;
  if (F.dmax !== "" && !(a.shoot_days <= +F.dmax)) return false;
  if (F.footprintOnly && metricOf(S.cmp.metric).get(a) == null) return false;

}
