function drawCompare() {
  const { mode, threshold, stage, q } = S.cmp;
  const byPractice = mode === "practice";
  const all = S.cmpData.apps;
  const apps = all.filter((a) => passesFilters(a));
  const qs = activeQs();
  const ansOf = (a, qid) => S.cmpData.ans[a.production_id]?.[qid]?.[stage] || null;
  const question = S.qs.find((x) => x.question_id === q);
  const dept = Object.fromEntries(S.depts.map((d) => [d.department_id, d.name]));
  const stageWord = stage === "wrap" ? "at wrap" : "at prep";
  const types = new Set(apps.map((a) => a.production_type || "Not set"));

  let yes, no;
  if (byPractice) { yes = apps.filter((a) => ansState(question, ansOf(a, q)) === "yes"); no = apps.filter((a) => ansState(question, ansOf(a, q)) === "no"); }
  else {
    yes = apps.filter((a) => (practiceScore(a.production_id, stage) ?? -1) >= threshold);
    no = apps.filter((a) => (practiceScore(a.production_id, stage) ?? -1) < threshold);
  }
  const blank = byPractice ? apps.filter((a) => !ansOf(a, q)).length : apps.length - yes.length - no.length;
  const naCount = byPractice ? apps.filter((a) => ansState(question, ansOf(a, q)) === "na").length : 0;
  const exclude = byPractice ? q : null;
  const Y = groupStats(yes, stage, exclude), N = groupStats(no, stage, exclude);
  const yesLabel = byPractice ? "Implemented" : "Compliant", noLabel = byPractice ? "Did not implement" : "Non-compliant";
  const sample = apps.some((a) => a.footprint_is_sample);
  const M = metricOf(S.cmp.metric);
  const noFootprint = apps.filter((a) => M.get(a) == null).length;

  // Which practices go with a better result on the chosen metric.
  const impact = qs.map((x) => {
    const y = apps.filter((a) => ansState(x, ansOf(a, x.question_id)) === "yes"), n = apps.filter((a) => ansState(x, ansOf(a, x.question_id)) === "no");
    const ys = groupStats(y, stage, x.question_id), ns = groupStats(n, stage, x.question_id);
    return { x, ys: ys.metrics[M.key].v, ns: ns.metrics[M.key].v, yn: ys.n, nn: ns.n, diff: mdiff(M, ys.metrics[M.key].v, ns.metrics[M.key].v) };
  }).sort((a, b) => M.higher ? (b.diff ?? -999) - (a.diff ?? -999) : (a.diff ?? 999) - (b.diff ?? 999));
  const maxDay = Math.max(1, ...impact.flatMap((i) => [i.ys || 0, i.ns || 0]));
  const withData = impact.filter((i) => i.diff != null);
  const impactShown = S.cmpShowAll ? impact : withData.slice(0, 12);

  const cols = [...apps].sort((a, b) => (practiceScore(b.production_id, stage) ?? -1) - (practiceScore(a.production_id, stage) ?? -1));
  const small = (g) => g.n > 0 && g.n < 3 ? `<span class="tag">Small group</span>` : "";
  const groupCard = (label, cls, g, list) => `
    <section class="panel cmp-card ${cls}">
      <div class="cmp-head"><span class="label">${label} · ${g.n} production${g.n === 1 ? "" : "s"}</span>${small(g)}</div>
      <div class="cmp-stats">
        <div class="lead"><strong>${mfmt(M, g.metrics[M.key].v).replace(/ \S+$/, "") }</strong><small>${M.unit === "%" ? "of waste diverted from landfill" : `${esc(M.unit)} ${esc(M.noun)} per shoot day`}${g.metrics[M.key].n < g.n ? ` (${g.metrics[M.key].n} of ${g.n} reported)` : ""}</small></div>
        ${M.key === "co2" ? `<div><strong>${t1(g.total)}</strong><small>t CO₂ per production</small></div>` : `<div><strong>${t1(g.metrics.co2.v)}</strong><small>t CO₂ per shoot day</small></div>`}
        <div><strong>${g.score ?? "–"}${g.score != null ? "%" : ""}</strong><small>${byPractice ? "score on other practices" : "practice score"}</small></div>
        <div><strong>${g.decided ? Math.round((g.approved / g.decided) * 100) + "%" : "–"}</strong><small>${g.decided ? `approved (${g.approved} of ${g.decided} decided)` : "none decided yet"}</small></div>
      </div>
      <ul class="cmp-list">${list.map((a) => `<li><a href="#app-${a.production_id}">${esc(a.production_name)}</a><span class="muted">${esc(a.production_type || "")}</span><span class="mono co2-chip">${M.get(a) == null ? "not reported" : mfmt(M, M.get(a)) + (M.unit === "%" ? " diverted" : "/day")}</span>${pill(a.status)}</li>`).join("") || `<li class="muted">None</li>`}</ul>
    </section>`;

  const ym = Y.metrics[M.key].v, nm = N.metrics[M.key].v, dd = mdiff(M, ym, nm);
  let verdict = "";
  if (Y.n && N.n) {
    const parts = [];
    if (dd != null) parts.push(M.unit === "%"
      ? `diverted <b>${Math.round(ym)}%</b> of their waste from landfill, versus ${Math.round(nm)}%`
      : `${M.verb} <b>${dd === 0 ? `the same ${esc(M.noun)}` : `${Math.abs(dd)}% ${dd < 0 ? "less" : "more"} ${esc(M.noun)}`}</b> per shoot day (${mfmt(M, ym)} vs. ${mfmt(M, nm)})`);
    if (Y.decided && N.decided) parts.push(`were approved ${Math.round(Y.approved / Y.decided * 100)}% of the time versus ${Math.round(N.approved / N.decided * 100)}%`);
    verdict = parts.length ? `${byPractice ? "Productions that did this" : "Compliant productions"} ${parts.join(", and ")}.` : "";
  }

  $app.innerHTML = `
    <div class="page-head">
      <div><p class="eyebrow">Best practices & footprint</p><h1>Analysis</h1>
        <p class="muted" style="max-width:66ch">Split submitted productions into those that follow best practices and those that don't, then compare their carbon, electricity, fuel, water and waste. Amounts are per shoot day so productions of different lengths compare fairly.</p></div>
    </div>
    <div class="panel cmp-controls">
      <label class="field"><span>Compare by</span><select id="cmp-mode">
        <option value="compliance" ${!byPractice ? "selected" : ""}>Overall compliance</option>
        <option value="practice" ${byPractice ? "selected" : ""}>A single practice</option></select></label>
      ${byPractice ? `<label class="field cmp-wide"><span>Practice</span><select id="cmp-q">${S.depts.map((d) => {
        const dq = S.qs.filter((x) => x.department_id === d.department_id);
        return dq.length ? `<optgroup label="${esc(d.name)}">${dq.map((x) => `<option value="${x.question_id}" ${x.question_id === q ? "selected" : ""}>${esc(qTitle(x))}</option>`).join("")}</optgroup>` : "";
      }).join("")}</select></label>`
      : `<label class="field cmp-wide"><span>Compliant at a practice score of at least</span><div class="thresh"><input type="range" id="cmp-th" min="10" max="100" step="5" value="${threshold}"><output class="mono" id="cmp-th-out">${threshold}%</output></div></label>`}
      <div class="field"><span>Stage</span><div class="chips">${[["wrap", "Wrap"], ["prep", "Prep"]].map(([k, l]) => `<button class="chip" data-stage="${k}" aria-pressed="${stage === k}">${l}</button>`).join("")}</div></div>
      <label class="field"><span>Compare on</span><select id="cmp-metric">${METRICS.map((m) => `<option value="${m.key}" ${m.key === M.key ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></label>
    </div>
    ${filterPanel(all, apps.length)}

    <h2 class="cmp-title">${byPractice ? esc(question?.question_text || "") : "Compliant vs. non-compliant productions"}
      <span class="muted">${byPractice ? `${esc(dept[question?.department_id] || "")} · ${stageWord}` : `Practice score of ${threshold}% or more ${stageWord}${S.cmpF.depts.length ? ", selected departments" : ""}`}</span></h2>
    ${sample ? `<p class="sample-note"><span class="tag">Sample figures</span> Some footprint numbers here are invented demo data, not real production results.</p>` : ""}
    <p class="cmp-verdict ${verdict ? "" : "muted"}">${verdict || (apps.length ? "Both groups need at least one production to compare. Try a different threshold or loosen the filters." : "No productions match these filters.")}</p>
    <div class="cmp-grid">
      ${groupCard(yesLabel, "yes", Y, yes)}
      ${groupCard(noLabel, "no", N, no)}
    </div>
    <section class="panel block">
      <div class="block-head"><h2>Footprint side by side</h2><span class="muted">Group averages · click a row to compare on it</span></div>
      <div class="table-scroll"><table class="mtable">
        <thead><tr><th>Metric</th><th class="num">${yesLabel}</th><th class="num">${noLabel}</th><th class="num">Difference</th><th class="num">Reported</th></tr></thead>
        <tbody>${METRICS.map((m) => { const a = Y.metrics[m.key], b = N.metrics[m.key], d = mdiff(m, a.v, b.v), good = mgood(m, d);
          return `<tr class="row ${m.key === M.key ? "sel" : ""}" data-metric="${m.key}"><td>${esc(m.label)}${m.higher ? ' <span class="muted">(higher is better)</span>' : ""}</td>
            <td class="num">${mfmt(m, a.v)}</td><td class="num">${mfmt(m, b.v)}</td>
            <td class="num"><b class="${good == null ? "" : good ? "good" : "worse"}">${mdiffText(m, d)}</b></td>
            <td class="num muted">${a.n + b.n} of ${Y.n + N.n}</td></tr>`; }).join("")}</tbody>
      </table></div>
    </section>
    <p class="muted cmp-foot">${[
      blank ? `${blank} production${blank > 1 ? "s" : ""} left this blank ${stageWord} and ${blank > 1 ? "aren't" : "isn't"} in either group.` : "",
      naCount ? `${naCount} answered N/A and ${naCount > 1 ? "aren't" : "isn't"} in either group.` : "",
      byPractice && question && !isYesNo(question) ? "For tiered questions, any answer that earns points counts as implemented." : "",
      noFootprint ? `${noFootprint} production${noFootprint > 1 ? "s haven't" : " hasn't"} reported ${esc(M.short)} yet.` : "",
      types.size > 1 ? "Footprints differ a lot by production type; filter by type for a like-for-like comparison." : "",
    ].filter(Boolean).join(" ")}</p>

    <section class="panel block">
      <div class="block-head"><h2>Which practices go with ${M.higher ? "higher waste diversion" : `less ${esc(M.noun)}`}</h2><span class="muted">${esc(M.label)}, did vs. didn't</span></div>
      <div class="table-scroll"><table class="impact">
        <thead><tr><th>Practice</th><th class="num">Did</th><th class="num">Didn't</th><th>${esc(M.label)}</th><th class="num">Difference</th></tr></thead>
        <tbody>${impactShown.map(({ x, ys, ns, yn, nn, diff }) => `<tr class="row ${byPractice && x.question_id === q ? "sel" : ""}" data-q="${x.question_id}">
          <td><span class="sub">${esc(dept[x.department_id] || "")}</span><div>${esc(qTitle(x))}</div></td>
          <td class="num">${yn}</td><td class="num">${nn}</td>
          <td class="duo">${diff == null ? `<span class="muted">Not enough data</span>` : `
            <div class="duo-line"><span class="k">Did</span><div class="track"><i class="wrap" style="width:${(ys / maxDay) * 100}%"></i></div><span class="mono">${mfmt(M, ys)}</span></div>
            <div class="duo-line"><span class="k">Didn't</span><div class="track"><i class="no" style="width:${(ns / maxDay) * 100}%"></i></div><span class="mono">${mfmt(M, ns)}</span></div>`}</td>
          <td class="num"><b class="${mgood(M, diff) == null ? "" : mgood(M, diff) ? "good" : "worse"}">${mdiffText(M, diff)}</b></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Not enough data. Each practice needs productions that did it and productions that didn't.</td></tr>`}</tbody>
      </table></div>
      <div class="block-body impact-more"><span class="muted">${S.cmpShowAll ? `All ${impact.length} practices` : `The ${impactShown.length} practices with the best ${esc(M.short)} result, of ${withData.length} with enough data`}</span>
        <button type="button" class="link" id="impactAll">${S.cmpShowAll ? "Show top 12" : `Show all ${impact.length}`}</button></div>
    </section>

    <section class="panel block">
      <div class="block-head"><h2>Department scores</h2><span class="muted">Share of available points earned ${stageWord}, highest overall first</span></div>
      ${apps.length ? `<div class="table-scroll"><table class="matrix heat">
        <thead><tr><th>Department</th>${cols.map((a) => `<th><a href="#app-${a.production_id}">${esc(a.production_name)}</a></th>`).join("")}</tr></thead>
        <tbody>${S.depts.filter((d) => qs.some((x) => x.department_id === d.department_id && !x.is_innovation)).map((d) => {
          const dqs = qs.filter((x) => x.department_id === d.department_id);
          return `<tr class="${byPractice && question?.department_id === d.department_id ? "sel" : ""}"><td>${esc(d.name)} <span class="muted">${dqs.length}</span></td>${cols.map((a) => {
            const v = practiceScore(a.production_id, stage, null, dqs);
            const band = v == null ? "" : v >= 75 ? "h4" : v >= 50 ? "h3" : v >= 25 ? "h2" : "h1";
            return `<td class="cell ${band}" title="${esc(a.production_name)}, ${esc(d.name)}: ${v == null ? "no answers" : Math.round(v) + "%"}">${v == null ? "–" : Math.round(v) + "%"}</td>`;
          }).join("")}</tr>`;
        }).join("")}
        <tr class="total"><td>PEACH score</td>${cols.map((a) => { const s = practiceScore(a.production_id, stage) ?? 0;
          return `<td class="num ${!byPractice ? (s >= threshold ? "ok-txt" : "warn-txt") : ""}">${Math.round(s)}%</td>`; }).join("")}</tr>
        <tr class="total"><td>${esc(M.label)}</td>${cols.map((a) => `<td class="num">${mfmt(M, M.get(a))}</td>`).join("")}</tr>
        ${M.key !== "co2" ? `<tr class="total"><td>CO₂ per shoot day</td>${cols.map((a) => `<td class="num">${mfmt(METRICS[0], tonnesPerDay(a))}</td>`).join("")}</tr>` : ""}</tbody>
      </table></div>` : `<div class="block-body"><p class="muted">No productions match these filters.</p></div>`}
    </section>`;

  // Controls
  document.getElementById("cmp-mode").addEventListener("change", (e) => { S.cmp.mode = e.target.value; history.replaceState(null, "", S.cmp.mode === "practice" ? "#analysis-" + S.cmp.q : "#analysis"); drawCompare(); });
  document.getElementById("cmp-q")?.addEventListener("change", (e) => { S.cmp.q = +e.target.value; history.replaceState(null, "", "#analysis-" + S.cmp.q); drawCompare(); });
  const th = document.getElementById("cmp-th");
  th?.addEventListener("input", () => { document.getElementById("cmp-th-out").textContent = th.value + "%"; });
  th?.addEventListener("change", () => { S.cmp.threshold = +th.value; drawCompare(); document.getElementById("cmp-th")?.focus(); });
  $app.querySelectorAll("[data-stage]").forEach((b) => b.addEventListener("click", () => { S.cmp.stage = b.dataset.stage; drawCompare(); }));
  document.getElementById("cmp-metric").addEventListener("change", (e) => { S.cmp.metric = e.target.value; drawCompare(); document.getElementById("cmp-metric")?.focus(); });
  $app.querySelectorAll("tr[data-metric]").forEach((tr) => tr.addEventListener("click", () => { S.cmp.metric = tr.dataset.metric; drawCompare(); }));
  document.getElementById("impactAll")?.addEventListener("click", () => { S.cmpShowAll = !S.cmpShowAll; drawCompare(); document.getElementById("impactAll")?.focus(); });
  $app.querySelectorAll(".impact tr[data-q]").forEach((tr) => tr.addEventListener("click", () => {
    S.cmp.q = +tr.dataset.q; S.cmp.mode = "practice"; history.replaceState(null, "", "#analysis-" + S.cmp.q); drawCompare(); window.scrollTo({ top: 0, behavior: "smooth" });
  }));

  // Filters (redraw, then put focus back on the control the viewer used)
  const redraw = (focusSel) => { drawCompare(); if (focusSel) document.querySelector(focusSel)?.focus(); };
  document.getElementById("fToggle").addEventListener("click", () => { S.cmpFiltersOpen = !S.cmpFiltersOpen; redraw("#fToggle"); });
  document.getElementById("fClear")?.addEventListener("click", () => { S.cmpF = emptyCmpFilters(); redraw("#fToggle"); });
  $app.querySelectorAll("[data-facet]").forEach((b) => b.addEventListener("click", () => {
    const list = S.cmpF.sel[b.dataset.facet], v = b.dataset.val, i = list.indexOf(v);
    i >= 0 ? list.splice(i, 1) : list.push(v);
    redraw(`[data-facet="${b.dataset.facet}"][data-val="${CSS.escape(v)}"]`);
  }));
  $app.querySelectorAll("[data-dept]").forEach((b) => b.addEventListener("click", () => {
    const id = +b.dataset.dept, list = S.cmpF.depts, i = list.indexOf(id);
    i >= 0 ? list.splice(i, 1) : list.push(id);
    redraw(`[data-dept="${id}"]`);
  }));
  for (const [id, key] of [["f-from", "from"], ["f-to", "to"], ["f-dmin", "dmin"], ["f-dmax", "dmax"]]) {
    document.getElementById(id)?.addEventListener("change", (e) => { S.cmpF[key] = e.target.value.trim(); redraw("#" + id); });
  }
  document.getElementById("f-fp")?.addEventListener("change", (e) => { S.cmpF.footprintOnly = e.target.checked; redraw("#f-fp"); });
}

function downloadCsv(name, rows) {
  const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  downloadCsv(`ema-applications-${stamp()}.csv`, [
    ["ID", "Production", "Type", "Format", "Location", "Studio", "UPM", "Point of contact", "SPR", "Status", "Submitted", "Reviewer",
     "Prep points (self)", "Prep available", "Prep %", "Wrap points (self)", "Wrap available", "Wrap %", "N/A answers (wrap)", "Innovation bonus (wrap)",
     "Verified wrap points", "Shoot days", "Diesel (gal)", "Gasoline (gal)", "Electricity (kWh)", "Air (passenger-miles)", "Water (gal)", "Landfill (lbs)", "Recycled (lbs)", "Composted (lbs)",
     "t CO2", "t CO2 per shoot day", "kWh per shoot day", "Water gal per shoot day", "Waste lbs per shoot day", "Waste diversion %", "Sample footprint"],

  ]);
}

async function exportAnswers() {
  const { apps, resp } = S.dash;
  const [da] = await Promise.all([fetchAll(() => sb.from("department_answerers").select("production_id,department_id,contact_id").order("production_id")), loadContacts()]);
  const deptAns = {};
  for (const x of da.data || []) deptAns[x.production_id + ":" + x.department_id] = x.contact_id;

  const app = Object.fromEntries(apps.map((a) => [a.production_id, a]));
  const q = Object.fromEntries(S.qs.map((x) => [x.question_id, x]));

  downloadCsv(`ema-answers-${stamp()}.csv`, [
    ["Production", "Status", "Department", "Code", "Action", "Impact category", "Innovation", "Points possible", "Prep answer", "Prep points (self)", "Wrap answer", "Wrap points (self)",

      return [app[x.production_id].production_name, STATUS[app[x.production_id].status], dept[qq.department_id], qq.code, qq.question_text, qq.category, qq.is_innovation ? "yes" : "",

}

async function adminCall(body) {
  const { data, error } = await sb.functions.invoke("admin-users", { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context?.json?.(); if (j?.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}

function drawUsers(flash = "") {
  const el = document.getElementById("peopleBody");
  const q = norm(S.peopleSearch), f = S.peopleFilter;
  const rows = S.people.filter((x) => (!q || norm(`${x.full_name} ${x.email} ${x.title}`).includes(q)) &&
    (f === "all" || (f === "deactivated" ? x.deactivated_at : !x.deactivated_at && x.role === f)));
  const counts = { all: S.people.length, deactivated: S.people.filter((x) => x.deactivated_at).length };

      <input type="search" id="userSearch" placeholder="Search name, email or title" value="${esc(S.peopleSearch)}" aria-label="Search people">

    <div class="panel table-scroll"><table class="ptable">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th class="num">Actions</th></tr></thead>
      <tbody>${rows.map((x) => { const me = x.id === S.me.id, off = !!x.deactivated_at;
        return `<tr data-uid="${esc(x.id)}" class="${off ? "off" : ""}">
          <td><div class="namecell">
            <input class="inline" data-k="full_name" value="${esc(x.full_name)}" aria-label="Name" placeholder="No name">

  const userBox = el.querySelector(".addbox");
  userBox.addEventListener("toggle", () => (S.addUserOpen = userBox.open));
  el.querySelectorAll("[data-uf]").forEach((b) => b.addEventListener("click", () => { S.peopleFilter = b.dataset.uf; drawUsers(); }));
  document.getElementById("userSearch").addEventListener("input", (e) => { S.peopleSearch = e.target.value; const pos = e.target.selectionStart; drawUsers(); const s = document.getElementById("userSearch"); s.focus(); s.setSelectionRange(pos, pos); });
  document.getElementById("addUser").addEventListener("submit", async (e) => {

    try {
      const res = await adminCall(body);
      const p2 = await sb.from("profiles").select("id,full_name,email,role,title,created_at,deactivated_at").order("created_at");
      if (!p2.error) S.people = p2.data;
      S.addUserOpen = false;
      drawUsers(res.password
        ? `<div class="panel credbox" role="status"><p><b>${esc(body.full_name)}</b> can now sign in as <span class="mono">${esc(body.email)}</span> with this temporary password:</p>

            <p class="muted small">Share it privately. It isn't shown again. They can change it under My account after signing in.</p></div>`
        : `<div class="panel credbox" role="status"><p>Invitation sent to <span class="mono">${esc(body.email)}</span>. They'll appear as active once they accept.</p></div>`);
      toast(`${body.full_name} added`);
    } catch (err) { fail(err); } finally { setBusy(false); }
  });
  const showPw = (name, pw) => drawUsers(`<div class="panel credbox" role="status"><p>New temporary password for <b>${esc(name)}</b>:</p>
    <p class="cred"><code id="tmpPw">${esc(pw)}</code><button class="link" id="copyPw">Copy</button></p><p class="muted small">Share it privately. Their old password no longer works.</p></div>`);
  el.querySelector("#copyPw")?.addEventListener("click", async () => {
    const t = document.getElementById("tmpPw").textContent;
    try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("tmpPw")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Press Ctrl+C or ⌘C to copy."); }
  });
  el.querySelectorAll("tr[data-uid] input.inline").forEach((inp) => inp.addEventListener("change", async () => {
    const id = inp.closest("tr").dataset.uid, k = inp.dataset.k, v = inp.value.trim() || null;
    const { error } = await sb.from("profiles").update({ [k]: v }).eq("id", id);
    if (error) return fail(error);
    const x = S.people.find((y) => y.id === id); if (x) x[k] = v;
    if (id === S.me.id) { S.me[k] = v; renderBar(); }
    toast("Saved");
  }));
  el.querySelectorAll("[data-role]").forEach((sel) => sel.addEventListener("change", async () => {
    const { error } = await sb.from("profiles").update({ role: sel.value }).eq("id", sel.dataset.role);
    if (error) return fail(error);
    const x = S.people.find((y) => y.id === sel.dataset.role); if (x) x.role = sel.value;
    toast(`${x?.full_name || x?.email || "User"} is now a ${sel.value}`); drawUsers();
  }));
  el.querySelectorAll("[data-reset]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.closest("tr").dataset.uid, x = S.people.find((y) => y.id === id);

    setBusy(true);
    try { const res = await adminCall({ action: "reset_password", user_id: id }); showPw(x.full_name || x.email, res.password); }
    catch (err) { fail(err); } finally { setBusy(false); }
  }));
  el.querySelectorAll("[data-delete]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.closest("tr").dataset.uid;
    if (S.delUser === id) { S.delUser = null; return drawUsers(); }
    S.delUser = id; S.delInfo = null; drawUsers();
    const { data, error } = await sb.from("productions").select("production_id,production_name,submitted_by,assigned_reviewer").or(`submitted_by.eq.${id},assigned_reviewer.eq.${id}`);
    if (S.delUser !== id) return;
    S.delInfo = error ? { error: true } : { owned: (data || []).filter((p) => p.submitted_by === id), reviewing: (data || []).filter((p) => p.assigned_reviewer === id) };
    drawUsers();
  }));
  el.querySelector("#delCancel")?.addEventListener("click", () => { S.delUser = null; drawUsers(); });
  el.querySelector("#delConfirm")?.addEventListener("click", async () => {
    const id = S.delUser, x = S.people.find((y) => y.id === id), name = x.full_name || x.email;

    if (typed !== "delete") { document.getElementById("delType").setAttribute("aria-invalid", "true"); return toast('Type "delete" to confirm.', "bad"); }
    const to = document.getElementById("delTo")?.value || null;
    setBusy(true);
    try {
      const res = await adminCall({ action: "delete", user_id: id, transfer_to: to });
      S.people = S.people.filter((y) => y.id !== id); S.delUser = null; S.delInfo = null;
      const dest = to && S.people.find((y) => y.id === to);
      toast(`${name} deleted${res.moved ? ` · ${res.moved} application${res.moved === 1 ? "" : "s"} moved to ${dest?.full_name || dest?.email}` : ""}`);
      drawUsers();

    setBusy(true);

      toast(`${x.full_name || x.email} ${active ? "reactivated" : "deactivated"}`); drawUsers(); }
    catch (err) { fail(err); } finally { setBusy(false); }
  }));
}

function deleteRow(x) {
  const name = esc(x.full_name || x.email), info = S.delInfo;
  const others = S.people.filter((y) => y.id !== x.id && !y.deactivated_at);
  let body;
  if (!info) body = `<p class="muted">Checking their applications…</p>`;
  else if (info.error) body = `<p>Couldn't check their applications. Their applications will be kept without an owner.</p>`;
  else {
    const n = info.owned.length, r = info.reviewing.length;
    body = `${n ? `<p><b>${name}</b> owns ${n} application${n === 1 ? "" : "s"}: ${info.owned.slice(0, 4).map((p) => esc(p.production_name)).join(", ")}${n > 4 ? ` and ${n - 4} more` : ""}.</p>
      <label class="field"><span>Move their applications to</span><select id="delTo">
        <option value="">Nobody: keep them without an owner (staff can still see them)</option>
        ${others.map((y) => `<option value="${esc(y.id)}">${esc(y.full_name || y.email)} · ${esc(y.role)}</option>`).join("")}</select></label>`
      : `<p><b>${name}</b> doesn't own any applications.</p>`}
      ${r ? `<p>${r} application${r === 1 ? " is" : "s are"} assigned to them for review and will become unassigned.</p>` : ""}`;
  }
  return `<tr class="delrow"><td colspan="6"><div class="delbox" role="group" aria-label="Delete ${name}">
    <p><b>Delete ${name} permanently?</b> They can't sign in again and this can't be undone. Answers, reviews, contacts and companies they entered stay in the portal.</p>
    ${body}
    <label class="field"><span>Type <b>delete</b> to confirm</span><input id="delType" autocomplete="off" spellcheck="false"></label>
    <div class="row-actions"><button class="danger-fill" id="delConfirm" ${info ? "" : "disabled"}>Delete permanently</button><button id="delCancel">Cancel</button></div>
  </div></td></tr>`;
}

  const box = el.querySelector(".addbox");
  box.addEventListener("toggle", () => (S.addCompanyOpen = box.open));
  document.getElementById("companySearch").addEventListener("input", (e) => { S.peopleSearch = e.target.value; const pos = e.target.selectionStart; drawCompanies(); const s = document.getElementById("companySearch"); s.focus(); s.setSelectionRange(pos, pos); });
  el.querySelectorAll("[data-kf]").forEach((b) => b.addEventListener("click", () => { S.companyKind = b.dataset.kf; drawCompanies(); }));
  document.getElementById("showArchived").addEventListener("change", (e) => { S.showArchived = e.target.checked; drawCompanies(); });
  const okUrl = (v) => !v || /^https?:\/\/\S+\.\S+/i.test(v);
  document.getElementById("addCompany").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id).value.trim().replace(/\s+/g, " ") || null;
    const row = { name: v("nco-name"), kind: v("nco-kind"), location: v("nco-location"), website: v("nco-website"), notes: v("nco-notes"), created_by: S.me.id };
    if (!row.name) return toast("Enter the company's name.", "bad");
    if (companyByName(row.name)) return toast(`${row.name} is already listed.`, "bad");
    if (row.website && !/^https?:\/\//i.test(row.website)) row.website = "https://" + row.website;
    if (!okUrl(row.website)) return toast("Enter a full website address, like https://example.com.", "bad");
    const { data, error } = await sb.from("companies").insert(row).select().single();
    if (error) return fail(error.code === "23505" ? new Error(`${row.name} is already listed.`) : error);
    S.companies.push(data); S.companies.sort((a, b) => a.name.localeCompare(b.name)); S.addCompanyOpen = true;
    toast(`${row.name} added`); drawCompanies(); document.getElementById("nco-name")?.focus();
  });
  el.querySelectorAll("tr[data-coid] .inline").forEach((inp) => inp.addEventListener("change", async () => {
    const id = +inp.closest("tr").dataset.coid, k = inp.dataset.k, c = companyById(id);
    let v = inp.value.trim().replace(/\s+/g, " ") || null;
    if (k === "name" && !v) { toast("A company needs a name.", "bad"); inp.value = c.name; return; }
    if (k === "name" && norm(v) !== norm(c.name) && companyByName(v)) { toast(`${v} is already listed.`, "bad"); inp.value = c.name; return; }
    if (k === "website" && v && !/^https?:\/\//i.test(v)) v = "https://" + v;
    if (k === "website" && !okUrl(v)) { toast("Enter a full website address, like https://example.com.", "bad"); return; }
    const { error } = await sb.from("companies").update({ [k]: v }).eq("company_id", id);
    if (error) return fail(error);
    if (k === "name") { // the database renamed it on applications and contacts too
      const old = norm(c.name);
      if (S.studioUse?.[old]) { S.studioUse[norm(v)] = S.studioUse[old]; delete S.studioUse[old]; }
      S.contacts.forEach((x) => { if (norm(x.company) === old) x.company = v; });
      (S.apps || []).forEach((a) => { if (norm(a.studio_affiliation) === old) a.studio_affiliation = v; });
    }
    c[k] = v; if (k === "website") inp.value = v || "";
    toast(k === "name" ? "Renamed everywhere it's used" : "Saved");
  }));
  el.querySelectorAll("[data-archive]").forEach((b) => b.addEventListener("click", async () => {
    const id = +b.closest("tr").dataset.coid, c = companyById(id);
    const { error } = await sb.from("companies").update({ archived: !c.archived }).eq("company_id", id);
    if (error) return fail(error);
    c.archived = !c.archived; toast(`${c.name} ${c.archived ? "archived" : "restored"}`); drawCompanies();
  }));
}

// ── Design (staff): name, logo, colors, fonts with live preview ───────────
const COLOR_FIELDS = [
  ["primary", "Primary", "Buttons, links, selected items"],
  ["highlight", "Highlight", "The sun behind the wordmark, header rule"],
  ["accent", "Accent", "Small decorative touches"],
  ["paper", "Background", "Page background"],
  ["ink", "Text", "Main text color"],
];
function renderDesign() {
  renderBar();
  const d = (S.themeDraft = structuredClone(S.theme));
  // Load every font pairing so the choices preview in their own type.
  if (!document.getElementById("allFonts")) {
    const l = document.createElement("link"); l.id = "allFonts"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?" + Object.values(FONT_PAIRS).map((f) => f.href).join("&") + "&display=swap";
    document.head.appendChild(l);
  }
  $app.innerHTML = `
    <div class="page-head"><div><p class="eyebrow">Staff</p><h1>Design</h1>
      <p class="muted" style="max-width:62ch">Change how the portal looks for everyone, including the sign-in page. Changes preview across the page as you edit and apply to everyone once you save.</p></div></div>
    <div class="design">
      <form id="designForm" class="design-form" novalidate>
        <section class="panel block"><div class="block-head"><h2>Name</h2></div><div class="block-body grid">
          <label class="field"><span>Organization (wordmark)</span><input id="ds-org" maxlength="24" value="${esc(d.org)}"></label>
          <label class="field"><span>Portal name</span><input id="ds-name" maxlength="60" value="${esc(d.name)}"></label>
          <label class="field" style="grid-column:1/-1"><span>Sign-in tagline</span><input id="ds-tagline" maxlength="90" value="${esc(d.tagline)}"></label>
        </div></section>
        <section class="panel block"><div class="block-head"><h2>Logo</h2><span class="muted">PNG, JPG, WebP or SVG, up to 1 MB</span></div><div class="block-body logo-row">
          <div class="logo-prev" id="logoPrev"></div>
          <div class="logo-actions"><label class="btn">Upload logo<input type="file" id="ds-logo" class="sr" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
            <button type="button" class="link danger" id="ds-logo-rm">Use the wordmark instead</button>
            <small class="muted">Without a logo, the header shows the organization name on the highlight-colored sun.</small></div>
        </div></section>
        <section class="panel block"><div class="block-head"><h2>Colors</h2><button type="button" class="link" id="ds-reset">Reset to EMA brand</button></div><div class="block-body colors">
          ${COLOR_FIELDS.map(([k, label, hint]) => `<div class="color-row">
            <input type="color" id="dc-${k}" value="${d.colors[k]}" aria-label="${label} color">
            <div><b>${label}</b><small class="muted">${hint}</small></div>
            <input class="hex mono" id="dh-${k}" value="${d.colors[k].toUpperCase()}" maxlength="7" aria-label="${label} hex value"></div>`).join("")}
          <p class="contrast-note" id="contrastNote" role="status"></p>
        </div></section>
        <section class="panel block"><div class="block-head"><h2>Typography</h2></div><div class="block-body fonts">
          ${Object.entries(FONT_PAIRS).map(([k, f]) => `<label class="font-card"><input type="radio" name="ds-font" value="${k}" ${d.fonts === k ? "checked" : ""}>
            <span class="fc-display" style="font-family:${esc(f.display)};font-weight:${f.weight};font-stretch:${f.stretch};text-transform:${f.hcase}">Green Seal</span>
            <span class="fc-body" style="font-family:${esc(f.body)}">${esc(f.label)} · ${esc(f.note)}</span></label>`).join("")}
        </div></section>
      </form>
      <aside class="design-preview panel" aria-label="Preview">
        <div class="pv-bar">${brandHTML(d)}</div>
        <div class="pv-body">
          <p class="eyebrow">Preview</p>
          <h1 class="pv-h1">Program dashboard</h1>
          <div class="pv-kpis"><div><span class="label">Applications</span><strong class="mono">8</strong></div><div><span class="label">Avg. PEACH score</span><strong class="mono">74%</strong></div></div>
          <div class="pv-bars"><div class="bar-line"><span>Prep</span><div class="track"><i class="prep" style="width:62%"></i></div><span class="mono">62%</span></div>
            <div class="bar-line"><span>Wrap</span><div class="track"><i class="wrap" style="width:78%"></i></div><span class="mono">78%</span></div></div>
          <p class="pv-pills">${pill("submitted")}${pill("in_review")}${pill("approved")}<span class="tag tag-innov">Innovation</span></p>
          <p class="pv-btns"><button type="button" class="primary">Submit application</button><button type="button">Save draft</button><a href="#design" onclick="return false">A link</a></p>
        </div>
      </aside>
    </div>`;
  drawLogoPrev();
  drawDesignActions();
  const sync = () => { applyTheme(S.themeDraft); document.querySelector(".pv-bar").innerHTML = brandHTML(S.themeDraft); drawLogoPrev(); checkContrast(); drawDesignActions(); };
  for (const [id, k, max] of [["ds-org", "org", 24], ["ds-name", "name", 60], ["ds-tagline", "tagline", 90]])
    document.getElementById(id).addEventListener("input", (e) => { S.themeDraft[k] = e.target.value.slice(0, max); sync(); });
  for (const [k] of COLOR_FIELDS) {
    const pick = document.getElementById("dc-" + k), hex = document.getElementById("dh-" + k);
    pick.addEventListener("input", () => { S.themeDraft.colors[k] = pick.value; hex.value = pick.value.toUpperCase(); hex.removeAttribute("aria-invalid"); sync(); });
    hex.addEventListener("input", () => { const v = hex.value.trim().replace(/^([^#])/, "#$1");
      if (HEX.test(v)) { S.themeDraft.colors[k] = v.toLowerCase(); pick.value = v.toLowerCase(); hex.removeAttribute("aria-invalid"); sync(); } else hex.setAttribute("aria-invalid", "true"); });
  }
  document.querySelectorAll("input[name=ds-font]").forEach((r) => r.addEventListener("change", () => { S.themeDraft.fonts = r.value; sync(); }));
  document.getElementById("ds-reset").addEventListener("click", () => { const keep = { org: S.themeDraft.org, name: S.themeDraft.name, tagline: S.themeDraft.tagline, logo_url: S.themeDraft.logo_url };
    S.themeDraft = { ...structuredClone(THEME_DEFAULT), ...keep }; renderDesignFromDraft(); });
  document.getElementById("ds-logo-rm").addEventListener("click", () => { S.themeDraft.logo_url = null; sync(); });
  document.getElementById("ds-logo").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (f.size > 1024 * 1024) return toast("That image is over 1 MB. Use a smaller file.", "bad");
    const ext = ({ "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/svg+xml": "svg" })[f.type];
    if (!ext) return toast("Use a PNG, JPG, WebP or SVG image.", "bad");
    const path = `logo-${Date.now()}.${ext}`;
    const { error } = await sb.storage.from("branding").upload(path, f, { contentType: f.type, upsert: false });
    if (error) return fail(error);
    S.themeDraft.logo_url = sb.storage.from("branding").getPublicUrl(path).data.publicUrl; sync(); toast("Logo uploaded. Save to apply it for everyone.");
  });
  checkContrast();
  function renderDesignFromDraft() { const keepDraft = S.themeDraft; renderDesign(); S.themeDraft = keepDraft; applyTheme(keepDraft);
    for (const [k] of COLOR_FIELDS) { document.getElementById("dc-" + k).value = keepDraft.colors[k]; document.getElementById("dh-" + k).value = keepDraft.colors[k].toUpperCase(); }
    document.querySelectorAll("input[name=ds-font]").forEach((r) => (r.checked = r.value === keepDraft.fonts));
    document.querySelector(".pv-bar").innerHTML = brandHTML(keepDraft); drawLogoPrev(); checkContrast(); drawDesignActions(); }
}
function drawLogoPrev() {
  const el = document.getElementById("logoPrev"); if (!el) return;
  el.innerHTML = S.themeDraft.logo_url ? `<img src="${esc(S.themeDraft.logo_url)}" alt="Current logo">` : `<span class="brand"><span class="mark">${esc(S.themeDraft.org)}</span></span>`;
}
function checkContrast() {
  const c = S.themeDraft.colors, el = document.getElementById("contrastNote"); if (!el) return;
  const issues = [];
  if (contrast(c.ink, c.paper) < 4.5) issues.push("Text on the background");
  if (contrast(c.primary, c.paper) < 3) issues.push("Primary color on the background");
  el.className = "contrast-note " + (issues.length ? "warn" : "ok");
  el.textContent = issues.length ? `${issues.join(" and ")} may be hard to read. Try a darker text or primary color, or a lighter background.` : "Text and buttons have enough contrast to read comfortably.";
}
function drawDesignActions() {
  const changed = JSON.stringify(S.themeDraft) !== JSON.stringify(S.theme);
  $actions.innerHTML = `<div class="actions"><div class="wrap"><span class="hint">${changed ? "Unsaved changes. Only you see them until you save." : "This is the current look for everyone."}</span>
    <button id="ds-discard" ${changed ? "" : "disabled"}>Discard changes</button><button class="primary" id="ds-save" ${changed ? "" : "disabled"}>Save for everyone</button></div></div>`;
  document.getElementById("ds-discard").addEventListener("click", () => { applyTheme(S.theme); renderDesign(); });
  document.getElementById("ds-save").addEventListener("click", async () => {
    const value = cleanTheme(S.themeDraft);
    const { error } = await sb.from("app_settings").upsert({ key: "theme", value, updated_by: S.me.id }, { onConflict: "key" });
    if (error) return fail(error);
    S.theme = value; S.themeDraft = structuredClone(value); applyTheme(value); toast("Design saved for everyone"); drawDesignActions();
  });
}

// ── My account: name, title, password ─────────────────────────────────────
function renderAccount() {
  renderBar();
  $app.innerHTML = `
    <div class="page-head"><div><p class="eyebrow">My account</p><h1>${esc(S.me.full_name || S.me.email)}</h1><p class="muted">${esc(S.me.email)} · ${esc(S.me.role)}</p></div></div>
    <div class="acct">
      <form class="panel block" id="acctProfile" novalidate><div class="block-head"><h2>Profile</h2></div>
        <div class="block-body grid">
          <label class="field"><span>Full name</span><input id="ac-name" value="${esc(S.me.full_name)}" autocomplete="name"></label>
          <label class="field"><span>Title</span><input id="ac-title" value="${esc(S.me.title)}" autocomplete="organization-title"></label>
          <div class="add-actions"><button class="primary" type="submit">Save profile</button></div>
        </div></form>
      <form class="panel block" id="acctPw" novalidate><div class="block-head"><h2>Change password</h2></div>
        <div class="block-body grid">
          <label class="field"><span>New password</span><input id="ac-pw" type="password" autocomplete="new-password" minlength="8"></label>
          <label class="field"><span>Repeat new password</span><input id="ac-pw2" type="password" autocomplete="new-password"></label>
          <div class="add-actions"><button class="primary" type="submit">Change password</button></div>
        </div></form>
    </div>`;
  document.getElementById("acctProfile").addEventListener("submit", async (e) => {
    e.preventDefault();
    const full_name = document.getElementById("ac-name").value.trim() || null, title = document.getElementById("ac-title").value.trim() || null;
    const { error } = await sb.from("profiles").update({ full_name, title }).eq("id", S.me.id);
    if (error) return fail(error);
    Object.assign(S.me, { full_name, title }); toast("Profile saved"); renderAccount();
  });
  document.getElementById("acctPw").addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = document.getElementById("ac-pw").value, b = document.getElementById("ac-pw2").value;
    if (a.length < 8) return toast("Use at least 8 characters.", "bad");
    if (a !== b) return toast("The two passwords don't match.", "bad");
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return fail(error);
    document.getElementById("ac-pw").value = document.getElementById("ac-pw2").value = ""; toast("Password changed");
  });
}

// ── Staff: questions ───────────────────────────────────────────────────────
async function renderQuestions() {
  renderBar();
  $app.innerHTML = `<p class="loading">Loading questions…</p>`;
  const [d, q] = await Promise.all([
    sb.from("departments").select("*").order("sort_order").order("department_id"),
    sb.from("questions").select("*").order("sort_order").order("question_id"),
  ]);
  if (d.error || q.error) return fail(d.error || q.error);
  const depts = d.data, all = q.data, active = all.filter((x) => x.active), retired = all.filter((x) => !x.active);
  const optText = (x) => optsOf(x).map((o) => `${o.label}${o.na ? "" : " · " + fmt(o.points)}`).join("  |  ");
  const row = (x) => `<div class="qrow" data-qid="${x.question_id}">
      <div class="qrow-head"><span class="tag">${esc(x.code || "pilot")}</span>${x.is_innovation ? '<span class="tag tag-innov">Innovation</span>' : ""}<span class="tag">${esc(x.category || "–")}</span>
        <span class="muted">${isYesNo(x) ? "Yes / No / N/A" : "Tiered answer"} · ${fmt(x.points_possible)} pts${x.form_version ? " · " + esc(x.form_version) : ""}</span></div>
      <label class="field"><span>Action</span><textarea data-k="question_text" rows="2">${esc(x.question_text)}</textarea></label>
      <div class="qrow-grid">
        <label class="field"><span>Evidence required</span><input data-k="documentation" value="${esc(x.documentation)}"></label>
        ${isYesNo(x) ? `<label class="field"><span>Points for Yes</span><input data-k="points_possible" type="number" min="0" step="0.5" value="${x.points_possible ?? ""}"></label>`
          : `<div class="field"><span>Answer choices and points</span><p class="optline">${esc(optText(x))}</p></div>`}
        <label class="check"><input type="checkbox" data-k="active" ${x.active ? "checked" : ""}>In use</label>
        <button data-save>Save</button>
      </div></div>`;
  const deptBlock = (dep) => { const list = active.filter((x) => x.department_id === dep.department_id);
    return `<details class="panel block qdept"><summary class="block-head"><h3>${esc(dep.name)}</h3><span class="mono muted">${list.length} actions · ${fmt(list.filter((x) => !x.is_innovation).reduce((t, x) => t + (+x.points_possible || 0), 0))} pts</span></summary>
      ${list.map(row).join("")}
      <div class="qrow qnew" data-new="${dep.department_id}">
        <label class="field"><span>Add a Yes / No / N/A action to ${esc(dep.name)}</span><textarea data-k="question_text" rows="2" placeholder="Title: what the production should do"></textarea></label>
        <div class="qrow-grid">
          <label class="field"><span>Evidence required</span><input data-k="documentation" placeholder="e.g. If yes, provide the vendor name."></label>
          <label class="field"><span>Points for Yes</span><input data-k="points_possible" type="number" min="0" step="0.5" placeholder="Pts"></label>
          <label class="field"><span>Impact category</span><select data-k="category">${["Energy", "Materials & Circularity", "Communication & Leadership"].map((c) => `<option>${c}</option>`).join("")}</select></label>
          <button class="primary" data-add>Add action</button>
        </div></div>
    </details>`; };
  $app.innerHTML = `
    <div class="page-head"><div><p class="eyebrow">Staff · PEACH v2.0</p><h1>Questions</h1>
      <p class="muted" style="max-width:66ch">${active.length} actions in use, worth ${fmt(possible())} base points plus ${fmt(bonusPossible())} Innovation bonus points. Changes apply to every application, including ones already scored. Tiered answer choices come from the PEACH workbook and aren't edited here.</p></div></div>
    ${depts.filter((dep) => active.some((x) => x.department_id === dep.department_id)).map(deptBlock).join("")}
    ${retired.length ? `<details class="panel block qdept"><summary class="block-head"><h3>Retired pilot questions</h3><span class="mono muted">${retired.length} · kept so old answers aren't lost</span></summary>${retired.map(row).join("")}</details>` : ""}
    <section class="panel block"><div class="block-head"><h3>Emission factors</h3><span class="muted">kg CO₂ per unit · used for every footprint</span></div>
      ${(S.factors || []).map((f) => `<div class="admin-row factor-row" data-fkey="${esc(f.key)}">
        <div><b>${esc(f.label)}</b> <span class="muted">per ${esc(f.unit)}</span><div class="muted" style="font-size:.8rem">${esc(f.source || "")}</div></div>
        <input aria-label="kg CO2 per ${esc(f.unit)}" type="number" min="0" step="any" value="${f.kg_co2_per_unit}" data-fval>
        <input aria-label="Source" value="${esc(f.source || "")}" placeholder="Source" data-fsrc>
        <button data-fsave>Save</button></div>`).join("")}
    </section>
    <section class="panel block"><div class="block-head"><h3>Add a department</h3></div>
      <div class="admin-row" style="grid-template-columns:minmax(0,1fr) auto"><input id="newDept" placeholder="e.g. Visual Effects" aria-label="Department name"><button class="primary" id="addDept">Add department</button></div></section>`;
  const vals = (el) => { const o = {}; el.querySelectorAll("[data-k]").forEach((i) => (o[i.dataset.k] = i.type === "checkbox" ? i.checked : i.type === "number" ? num(i.value) : i.value.trim() || null)); return o; };
  const refresh = async () => { try { await reloadQuestions(); } catch (e) { fail(e); } };
  $app.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-qid]"), x = all.find((y) => y.question_id === +r.dataset.qid), v = vals(r);
    if (!v.question_text) return toast("An action needs text.", "bad");
    if ("points_possible" in v) {
      if (v.points_possible == null || v.points_possible < 0) return toast("Enter points of zero or more.", "bad");
      if (x.answer_options) v.answer_options = x.answer_options.map((o) => (o.label === "Yes" ? { ...o, points: v.points_possible } : o));
    }
    const { error } = await sb.from("questions").update(v).eq("question_id", x.question_id);
    if (error) return fail(error);
    Object.assign(x, v); toast("Saved"); refresh();
  }));
  $app.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-new]"), v = vals(r);
    if (!v.question_text) return toast("Type the action first.", "bad");
    if (v.points_possible == null || v.points_possible < 0) return toast("Enter the points for Yes.", "bad");
    const { error } = await sb.from("questions").insert({ ...v, department_id: +r.dataset.new, active: true, form_version: "Custom", is_ema_relevant: true,
      sort_order: Math.max(0, ...all.map((y) => y.sort_order || 0)) + 1,
      answer_options: [{ label: "Yes", points: v.points_possible, na: false }, { label: "No", points: 0, na: false }, { label: "N/A", points: 0, na: true }] });
    if (error) return fail(error); toast("Action added"); await refresh(); renderQuestions();
  }));
  $app.querySelectorAll("[data-fsave]").forEach((b) => b.addEventListener("click", async () => {
    const r = b.closest("[data-fkey]"); const v = num(r.querySelector("[data-fval]").value);
    if (v == null || isNaN(v) || v < 0) return toast("Enter a factor of zero or more.", "bad");
    const { error } = await sb.from("emission_factors").update({ kg_co2_per_unit: v, source: r.querySelector("[data-fsrc]").value.trim() || null, updated_at: new Date().toISOString() }).eq("key", r.dataset.fkey);
    if (error) return fail(error);
    const f = S.factors.find((x) => x.key === r.dataset.fkey); if (f) f.kg_co2_per_unit = v;
    toast("Emission factor saved");
  }));
  document.getElementById("addDept").addEventListener("click", async () => {
    const name = document.getElementById("newDept").value.trim();
    if (!name) return toast("Type a department name.", "bad");
    const { error } = await sb.from("departments").insert({ name, sort_order: Math.max(0, ...depts.map((x) => x.sort_order || 0)) + 1 });
    if (error) return fail(error); toast("Department added. Add an action to it so it shows on the form."); renderQuestions();
  });
}

boot();
</script>
</body>
